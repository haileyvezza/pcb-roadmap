<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<script>(function(){var s=localStorage.getItem('pcb-theme'),d=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',s||d);})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<title>Roadmap Calendar — PCB</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-primary:  #f6f6f7;
    --bg-card:     #ffffff;
    --bg-input:    #f3f3f6;
    --bg-sidebar:  #ffffff;
    --border:      rgba(0,0,0,0.08);
    --border-hover: rgba(0,0,0,0.14);
    --text-primary: #1a1a1f;
    --text-secondary: #6b6b76;
    --text-muted:  #9a9aa4;
    --accent-green: #0088FF;
    --accent-green-dim: rgba(0,136,255,0.08);
    --accent-green-hover: #0066FF;
    --radius:      12px;
    --radius-sm:   8px;
    --shadow:      0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    --shadow-card: 0 1px 3px rgba(0,0,0,0.06);
    --shadow-lg:   0 8px 30px rgba(0,0,0,0.08);
    --font-sans:   'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --sidebar-width: 200px;
    --sidebar-collapsed: 56px;

    /* Phase colors */
    --phase-prototype: #a855f7;
    --phase-build: #f59e0b;
    --phase-observe: #06b6d4;
    --phase-release: #3b82f6;
    --phase-done: #94a3b8;
    --phase-planned: #cbd5e1;
    --phase-off-vault: #d1d5db;
    --today: #dc2626;

    /* Layout */
    --label-w:   440px;
    --row-h:     34px;
    --tl-header: 40px;
  }

  [data-theme="dark"] {
    --bg-primary:  #101114;
    --bg-card:     #202227;
    --bg-input:    #292C32;
    --bg-sidebar:  #1a1a1f;
    --border:      rgba(252,252,253,0.08);
    --border-hover: rgba(252,252,253,0.15);
    --text-primary: #FCFCFD;
    --text-secondary: #9DA1AE;
    --text-muted:  #676D7E;
    --shadow:      0 1px 3px rgba(0,0,0,0.4);
    --shadow-card: 0 1px 4px rgba(0,0,0,0.4);
    --shadow-lg:   0 8px 30px rgba(0,0,0,0.5);
  }

  body { background: var(--bg-primary); color: var(--text-primary); font-family: var(--font-sans); font-size: 13px; overflow: hidden; height: 100vh; display: flex; flex-direction: row; }

  /* ── Top nav ── */
  header {
    background: var(--bg-card);
    border-bottom: 1px solid var(--border);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
  }
  .header-row2 {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    height: 36px;
    gap: 16px;
    border-top: 1px solid var(--border);
    background: var(--bg-primary);
  }
  .header-left { display: flex; align-items: center; gap: 14px; }
  .header-right { display: flex; align-items: center; gap: 10px; }
  .window-label { color: var(--text-muted); font-size: 12px; white-space: nowrap; }
  #stats { font-size: 11px; color: var(--text-muted); white-space: nowrap; }

  /* ── Gantt wrapper ── */
  #gantt-wrap {
    flex: 1;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ── Timeline header ── */
  #tl-header {
    height: var(--tl-header);
    display: flex;
    flex-shrink: 0;
    border-bottom: 1px solid var(--border);
    background: var(--bg-card);
  }
  .label-spacer {
    width: var(--label-w);
    min-width: var(--label-w);
    border-right: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 12px;
    gap: 8px;
  }
  #search {
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--text-primary);
    font-size: 12px;
    padding: 3px 8px;
    width: 100%;
    outline: none;
  }
  #search::placeholder { color: var(--text-muted); }
  #months-row {
    flex: 1;
    position: relative;
    overflow: hidden;
  }
  .month-label {
    position: absolute;
    top: 0;
    height: 100%;
    display: flex;
    align-items: center;
    padding-left: 8px;
    font-size: 11px;
    color: var(--text-muted);
    font-weight: 500;
    border-left: 1px solid var(--border);
    pointer-events: none;
  }
  .month-label.current-month { color: var(--text-primary); }

  /* ── Scroll body ── */
  #gantt-body {
    flex: 1;
    overflow-y: auto;
    overflow-x: hidden;
    display: flex;
  }

  /* ── Left labels column ── */
  #labels-col {
    width: var(--label-w);
    min-width: var(--label-w);
    border-right: 1px solid var(--border);
    flex-shrink: 0;
  }

  /* ── Right bars column ── */
  #bars-col {
    flex: 1;
    position: relative;
    min-width: 0;
  }

  /* ── Month grid lines (behind bars) ── */
  .grid-line {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 1px;
    background: var(--border);
    pointer-events: none;
  }
  .grid-line.today-line { background: var(--today); width: 2px; z-index: 10; }

  /* ── Team header ── */
  .team-header {
    height: 30px;
    display: flex;
    align-items: center;
    padding: 0 12px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: .06em;
    color: var(--text-muted);
    background: var(--bg-input);
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    user-select: none;
    gap: 6px;
  }
  .team-header:hover { background: rgba(0,0,0,.04); }
  .team-chevron { font-size: 9px; transition: transform .2s; }
  .team-header.collapsed .team-chevron { transform: rotate(-90deg); }

  .team-bar-row {
    height: 30px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-input);
  }

  .subteam-header {
    height: 26px;
    display: flex;
    align-items: center;
    padding: 0 12px 0 16px;
    font-size: 10px;
    font-weight: 600;
    color: var(--text-secondary);
    border-bottom: 1px solid var(--border);
    gap: 5px;
  }
  .subteam-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--text-muted); flex-shrink: 0; }
  .subteam-bar-row {
    height: 26px;
    border-bottom: 1px solid var(--border);
  }

  /* ── Project row ── */
  .project-label {
    height: var(--row-h);
    display: flex;
    align-items: center;
    padding: 0 8px 0 24px;
    border-bottom: 1px solid var(--border);
    cursor: pointer;
    transition: background .1s;
    gap: 6px;
    min-width: 0;
  }
  .project-label:hover { background: rgba(0,0,0,.06); }
  .project-label.dimmed { opacity: .35; }
  .project-name {
    font-size: 12px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    flex: 1;
    min-width: 0;
    max-width: none;
  }
  a.proj-link { color: var(--text-primary); text-decoration: none; }
  a.proj-link:hover { color: var(--accent-green); text-decoration: underline; }
  .vault-icon { font-size: 8px; margin-left: 3px; opacity: 0.5; }
  a.proj-link:hover .vault-icon { opacity: 1; }
  .not-on-vault { font-size: 9px; color: var(--text-muted); font-style: italic; margin-left: 4px; }
  .priority-dot {
    width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0;
  }

  .project-bar-row {
    height: var(--row-h);
    position: relative;
    border-bottom: 1px solid var(--border);
    transition: background .1s;
  }
  .project-bar-row:hover { background: rgba(0,0,0,.04); }
  .project-bar-row.dimmed { opacity: .35; }

  /* ── Priority bars ── */
  .phase-bar {
    position: absolute;
    height: 10px;
    top: 50%;
    transform: translateY(-50%);
    border-radius: 3px;
    opacity: .7;
    transition: opacity .15s;
    cursor: pointer;
  }
  .phase-bar:hover { opacity: 1; }
  .phase-bar[data-phase="prototype"] { background: var(--phase-prototype); }
  .phase-bar[data-phase="build"] { background: var(--phase-build); }
  .phase-bar[data-phase="observe"] { background: var(--phase-observe); }
  .phase-bar[data-phase="release"] { background: var(--phase-release); }
  .phase-bar[data-phase="done"] { background: var(--phase-done); }
  .phase-bar[data-phase="planned"] { background: var(--phase-planned); }
  .phase-bar[data-phase="stopped"] { background: #ef4444; }

  .phase-tag {
    font-size: 9px;
    font-weight: 600;
    text-transform: capitalize;
    white-space: nowrap;
    flex-shrink: 0;
    padding: 1px 6px;
    border-radius: 4px;
    background: var(--bg-input);
  }

  /* Priority pill (P0/P1/P2/P3) */
  .prio-pill {
    font-size: 10px;
    font-weight: 700;
    padding: 1px 6px;
    border-radius: 4px;
    flex-shrink: 0;
    letter-spacing: 0.02em;
  }
  .prio-pill.p0 { background: #fee2e2; color: #b91c1c; }
  .prio-pill.p1 { background: #fef3c7; color: #b45309; }
  .prio-pill.p2 { background: #e0e7ff; color: #4338ca; }
  .prio-pill.p3, .prio-pill.p4 { background: var(--bg-input); color: var(--text-muted); }
  [data-theme="dark"] .prio-pill.p0 { background: #450a0a; color: #fca5a5; }
  [data-theme="dark"] .prio-pill.p1 { background: #451a03; color: #fcd34d; }
  [data-theme="dark"] .prio-pill.p2 { background: #1e1b4b; color: #a5b4fc; }

  /* Date label rendered alongside the phase bar */
  .bar-date {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    font-size: 10px;
    font-weight: 600;
    color: var(--text-secondary);
    padding-left: 6px;
    white-space: nowrap;
    pointer-events: none;
  }

  /* ── Tooltip ── */
  #tooltip {
    position: fixed;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 14px;
    max-width: 300px;
    pointer-events: none;
    z-index: 1000;
    box-shadow: 0 8px 24px rgba(0,0,0,.12);
    opacity: 0;
    transition: opacity .1s;
  }
  #tooltip.visible { opacity: 1; }
  .tt-name { font-weight: 600; font-size: 13px; margin-bottom: 4px; }
  .tt-tldr { color: var(--text-muted); font-size: 11px; line-height: 1.5; margin-bottom: 6px; }
  .tt-meta { display: flex; gap: 8px; flex-wrap: wrap; }
  .tt-badge { font-size: 10px; padding: 2px 7px; border-radius: 10px; font-weight: 500; }

  /* ── Legend ── */
  #legend {
    display: flex;
    align-items: center;
    gap: 14px;
    padding: 0 8px;
  }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text-muted); }
  .legend-swatch { width: 10px; height: 10px; border-radius: 2px; }

  /* ── Type toggle ── */
  .type-toggle {
    display: flex;
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 6px;
    overflow: hidden;
  }
  .type-toggle button {
    padding: 4px 10px;
    font-size: 12px;
    font-weight: 500;
    color: var(--text-muted);
    background: transparent;
    border: none;
    cursor: pointer;
    transition: background .15s, color .15s;
    white-space: nowrap;
  }
  .type-toggle button:not(:last-child) { border-right: 1px solid var(--border); }
  .type-toggle button:hover { background: var(--border); color: var(--text-primary); }
  .type-toggle button.active { background: var(--accent-green); color: #fff; }

  /* ── Empty state ── */
  .empty { padding: 40px; text-align: center; color: var(--text-muted); }

  /* scrollbar */
  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  /* ── Sidebar (Retail Hub style) ── */
  .app-layout { display: flex; height: 100vh; overflow: hidden; width: 100%; }
  .sidebar {
    width: var(--sidebar-width);
    background: var(--bg-sidebar);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    transition: width 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    overflow: hidden;
    z-index: 100;
    border-right: 1px solid var(--border);
  }
  .sidebar.collapsed { width: var(--sidebar-collapsed); }
  .sidebar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 14px;
    border-bottom: 1px solid var(--border);
    min-height: 56px;
  }
  .sidebar-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    overflow: hidden;
    white-space: nowrap;
  }
  .sidebar-logo { font-size: 18px; flex-shrink: 0; width: 28px; text-align: center; }
  .sidebar-title { font-size: 13px; font-weight: 700; color: var(--text-primary); letter-spacing: -0.01em; transition: opacity 0.2s; white-space: nowrap; }
  .sidebar.collapsed .sidebar-title { opacity: 0; width: 0; }
  .sidebar-toggle {
    background: none; border: none; color: var(--text-muted);
    cursor: pointer; padding: 6px; border-radius: 6px;
    transition: all 0.15s; flex-shrink: 0; font-size: 11px;
  }
  .sidebar-toggle:hover { background: var(--bg-input); color: var(--text-primary); }
  .sidebar.collapsed .sidebar-header { justify-content: center; padding: 16px 0; }
  .sidebar.collapsed .sidebar-brand { display: none; }
  .sidebar-nav {
    padding: 10px 8px;
    display: flex; flex-direction: column; gap: 2px;
  }
  .sidebar-spacer { flex: 1; }
  .sidebar-bottom {
    padding: 8px 8px 16px;
    display: flex; flex-direction: column; gap: 2px;
    border-top: 1px solid var(--border);
  }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 12px; border-radius: 8px; cursor: pointer;
    color: var(--text-secondary); transition: all 0.15s;
    white-space: nowrap; overflow: hidden;
    font-size: 13px; font-weight: 500;
    text-decoration: none; position: relative;
  }
  .nav-item::before {
    content: ''; position: absolute; left: 0; top: 50%;
    transform: translateY(-50%); width: 3px; height: 0;
    border-radius: 0 2px 2px 0; background: var(--accent-green);
    transition: height 0.2s;
  }
  .nav-item:hover { background: var(--bg-input); color: var(--text-primary); }
  .nav-item:hover::before { height: 14px; }
  .nav-item.active { background: rgba(0,136,255,0.08); color: var(--accent-green); font-weight: 600; }
  .nav-item.active::before { height: 20px; }
  .nav-item i { width: 16px; text-align: center; flex-shrink: 0; font-size: 13px; }
  .nav-label { transition: opacity 0.2s; }
  .sidebar.collapsed .nav-label { opacity: 0; width: 0; }
  .sidebar.collapsed .nav-item { justify-content: center; padding: 9px; gap: 0; }
  .sidebar.collapsed .sidebar-nav,
  .sidebar.collapsed .sidebar-bottom { padding-left: 0; padding-right: 0; align-items: center; }
  .nav-sub { display: flex; flex-direction: column; gap: 1px; margin-top: 1px; }
  .nav-sub-item { display: flex; align-items: center; gap: 8px; padding: 7px 10px 7px 32px; border-radius: 8px; cursor: pointer; color: var(--text-muted); font-size: 12px; font-weight: 500; text-decoration: none; transition: all 0.15s; white-space: nowrap; overflow: hidden; }
  .nav-sub-item:hover { background: var(--bg-input); color: var(--text-primary); }
  .nav-sub-item.active { color: var(--accent-green); font-weight: 600; }
  .nav-item.parent-active { color: var(--text-primary); }
  .sidebar.collapsed .nav-sub { display: none; }

  /* ── Main content wrapper ── */
  .main-content {
    flex: 1; min-width: 0;
    display: flex; flex-direction: column;
    overflow: hidden;
    background: var(--bg-primary);
  }

  /* ── Dark mode overrides ── */
  [data-theme="dark"] #tl-header { background: var(--bg-card); }
  [data-theme="dark"] .team-header { background: var(--bg-input); color: var(--text-secondary); }
  [data-theme="dark"] .team-header:hover { background: var(--bg-input); filter: brightness(1.1); }
  [data-theme="dark"] .project-label:hover { background: rgba(255,255,255,0.04); }
  [data-theme="dark"] .project-bar-row:hover { background: rgba(255,255,255,0.02); }
  [data-theme="dark"] #search { background: var(--bg-input); color: var(--text-primary); border-color: var(--border); }
  [data-theme="dark"] #tooltip { background: var(--bg-card); border-color: var(--border); }
  [data-theme="dark"] .type-toggle { background: var(--bg-input); border-color: var(--border); }
  [data-theme="dark"] .type-toggle button { color: var(--text-secondary); }
  [data-theme="dark"] .type-toggle button:not(:last-child) { border-color: var(--border); }
  [data-theme="dark"] select { background: var(--bg-input); color: var(--text-primary); border-color: var(--border); }
</style>
</head>
<body>

<div class="app-layout">

<nav class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-brand">
      <span class="sidebar-logo">💳</span>
      <span class="sidebar-title">PCB Roadmap</span>
    </div>
    <button class="sidebar-toggle" id="sidebarToggle" title="Collapse"><i class="fas fa-chevron-left"></i></button>
  </div>
  <div class="sidebar-nav">
    <a href="https://pcb-hub.quick.shopify.io/" class="nav-item">
      <i class="fas fa-house"></i>
      <span class="nav-label">PCB Hub</span>
    </a>
    <a href="timeline.html" class="nav-item active">
      <i class="fas fa-chart-gantt"></i>
      <span class="nav-label">Roadmap Calendar</span>
    </a>
    <div class="nav-sub">
      <a href="index.html" class="nav-sub-item">
        <i class="fas fa-table-cells"></i>
        <span class="nav-label">Roadmap</span>
      </a>
      <a href="themes.html" class="nav-sub-item">
        <i class="fas fa-layer-group"></i>
        <span class="nav-label">By Theme</span>
      </a>
      <a href="performance.html" class="nav-sub-item">
        <i class="fas fa-chart-line"></i>
        <span class="nav-label">Performance to Plan</span>
      </a>
      <a href="calendar.html" class="nav-sub-item">
        <i class="fas fa-calendar-days"></i>
        <span class="nav-label">Release Calendar</span>
      </a>
      <a href="weekly.html" class="nav-sub-item">
        <i class="fas fa-bolt"></i>
        <span class="nav-label">Weekly Snapshot</span>
      </a>
    </div>
  </div>
  <div class="sidebar-spacer"></div>
  <div class="sidebar-bottom">
    <a href="https://docs.google.com/spreadsheets/d/17xd1aWdtf33kUk3giF5WyC4dJpbClOjPGh2cVMYiuvI" target="_blank" class="nav-item">
      <i class="fas fa-external-link-alt"></i>
      <span class="nav-label">Source Sheet</span>
    </a>
    <div class="nav-item" id="darkModeToggle">
      <i class="fas fa-moon"></i>
      <span class="nav-label">Dark Mode</span>
    </div>
  </div>
</nav>

<div class="main-content">
<header>
  <div class="header-row2">
    <div class="header-left">
      <span class="window-label" id="window-label"></span>
      <span id="stats"></span>
      <div id="legend">
        <div class="legend-item"><div class="legend-swatch" style="background:var(--phase-prototype)"></div>Prototype</div>
        <div class="legend-item"><div class="legend-swatch" style="background:var(--phase-build)"></div>Build</div>
        <div class="legend-item"><div class="legend-swatch" style="background:var(--phase-observe)"></div>Observe</div>
        <div class="legend-item"><div class="legend-swatch" style="background:var(--phase-release)"></div>Release</div>
        <div class="legend-item"><div class="legend-swatch" style="background:var(--phase-done)"></div>Done</div>
        <div class="legend-item"><div class="legend-swatch" style="background:var(--phase-planned)"></div>Backlog</div>
        <div class="legend-item"><div class="legend-swatch" style="background:var(--phase-off-vault);border:1px solid var(--border)"></div>Off Vault</div>
      </div>
    </div>
    <div class="header-right">
      <label style="display:flex;align-items:center;gap:4px;font-size:12px;color:var(--text-secondary);cursor:pointer;white-space:nowrap;">
        <input type="checkbox" id="vault-only" style="cursor:pointer;"> Vault Only
      </label>
      <select id="filter-team" style="background:var(--bg-input);border:1px solid var(--border);border-radius:6px;color:var(--text-primary);font-size:12px;padding:4px 8px;outline:none;cursor:pointer;">
        <option value="">All Teams</option>
      </select>
    </div>
  </div>
</header>

<div id="gantt-wrap">
  <div id="tl-header">
    <div class="label-spacer">
      <input id="search" type="text" placeholder="Search projects…">
    </div>
    <div id="months-row"></div>
  </div>
  <div id="gantt-body">
    <div id="labels-col"></div>
    <div id="bars-col"></div>
  </div>
</div>
</div><!-- .main-content -->

</div><!-- .app-layout -->
<div id="tooltip"></div>

<script>
// ── Constants ────────────────────────────────────────────────────────────────
const TEAMS = [
  'Money Movement',
  'Payments Platform & Risk',
  'Cross Border',
  'Payments Experience',
  'Shop Wallet',
  'Billing',
  'Taxes'
];

const PHASE_COLORS = {
  'prototype': '#a855f7', 'build': '#f59e0b', 'observe': '#06b6d4',
  'release': '#3b82f6', 'done': '#94a3b8', 'planned': '#cbd5e1',
  'stopped': '#ef4444', 'off-vault': '#d1d5db'
};
const PHASE_ORDER = { 'build': 0, 'observe': 1, 'release': 2, 'prototype': 3, 'done': 4, 'planned': 5, 'stopped': 6, 'off-vault': 7 };

function getPhase(p) {
  const phase = (p.phase || '').toLowerCase().replace(/_/g, '-');
  if (phase === 'done') return 'done';
  if (phase === 'release') return 'release';
  if (phase === 'observe') return 'observe';
  if (phase === 'build' || phase === 'in-progress') return 'build';
  if (phase === 'prototype') return 'prototype';
  if (phase === 'stopped' || phase === 'paused') return 'stopped';
  if (phase === 'proposal') return 'prototype';
  if (phase === 'planned') return 'planned';
  const hasVault = !!getVaultUrl(p.name);
  if (!hasVault) {
    const vs = (p.vaultStatus || '').toLowerCase();
    if (vs === 'backlog') return 'planned';
    return 'off-vault';
  }
  return 'build';
}

// ── State ────────────────────────────────────────────────────────────────────
let allProjects = [];
let vaultUrls = {};
let searchQuery = '';
let halfFilter = 'all';
let teamFilter = '';
let vaultOnly = false;
let collapsed = {};

// ── Window calc ──────────────────────────────────────────────────────────────
const WIN = {
  start: new Date(2026, 0, 1),
  end: new Date(2026, 11, 31),
  totalMs: new Date(2026, 11, 31) - new Date(2026, 0, 1)
};

function pct(date) {
  if (!date) return null;
  const d = typeof date === 'string' ? new Date(date) : date;
  return Math.max(0, Math.min(100, (d - WIN.start) / WIN.totalMs * 100));
}

function parseDate(str) {
  if (!str) return null;
  const s = str.trim();
  
  // Quarter references
  if (s.includes('Q1')) return new Date(2026, 2, 15);
  if (s.includes('Q2')) return new Date(2026, 5, 15);
  if (s.includes('Q3')) return new Date(2026, 8, 15);
  if (s.includes('Q4')) return new Date(2026, 11, 15);
  
  // "Jan 2026", "Feb 2026", etc.
  if (s.match(/^(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)\s*\d{4}/i)) {
    const d = new Date(s);
    return isNaN(d) ? null : d;
  }
  
  // "Jan", "Feb", etc. (assume 2026)
  if (s.match(/^(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)$/i)) {
    const d = new Date(s + ' 15, 2026');
    return isNaN(d) ? null : d;
  }
  
  // MM/DD/YYYY format
  if (s.match(/^\d{1,2}\/\d{1,2}\/\d{4}/)) {
    const d = new Date(s);
    return isNaN(d) ? null : d;
  }
  
  // Try natural parsing as last resort (but assume 2026 if no year)
  if (!s.match(/\d{4}/) && s.match(/\d/)) {
    const d = new Date(s + ' 2026');
    return isNaN(d) ? null : d;
  }

  // Anything with a 4-digit year (e.g. "Jul 1, 2026", "2026-07-01")
  if (s.match(/\d{4}/)) {
    const d = new Date(s);
    if (!isNaN(d)) return d;
  }

  return null;
}

function setHalfFilter(h) {
  halfFilter = h;
  ['h1', 'h2', 'all'].forEach(t => {
    const el = document.getElementById('type-' + t);
    if (el) el.classList.toggle('active', t === h.toLowerCase());
  });
  render();
}

// ── Window label ─────────────────────────────────────────────────────────────
function renderWindowLabel() {
  const today = new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  document.getElementById('window-label').textContent = `Jan 2026 – Dec 2026 · Today: ${today}`;
}

// ── Month labels & grid lines ─────────────────────────────────────────────────
function renderMonths() {
  const row = document.getElementById('months-row');
  const barsCol = document.getElementById('bars-col');
  row.innerHTML = '';
  Array.from(barsCol.querySelectorAll('.grid-line')).forEach(el => el.remove());

  const months = [];
  let cur = new Date(WIN.start.getFullYear(), WIN.start.getMonth(), 1);
  const todayStr = new Date().toISOString().slice(0, 7);
  while (cur <= WIN.end) {
    months.push(new Date(cur));
    cur.setMonth(cur.getMonth() + 1);
  }

  months.forEach(m => {
    const p = pct(m);
    if (p === null || p > 100) return;
    const label = document.createElement('div');
    label.className = 'month-label' + (m.toISOString().slice(0,7) === todayStr ? ' current-month' : '');
    label.style.left = p + '%';
    label.textContent = m.toLocaleDateString('en-US', { month: 'short' });
    row.appendChild(label);

    const line = document.createElement('div');
    line.className = 'grid-line';
    line.style.left = p + '%';
    barsCol.appendChild(line);
  });

  const todayPct = pct(new Date());
  if (todayPct >= 0 && todayPct <= 100) {
    const tl = document.createElement('div');
    tl.className = 'grid-line today-line';
    tl.style.left = todayPct + '%';
    barsCol.appendChild(tl);
  }
}

// ── Filter ───────────────────────────────────────────────────────────────────
function getFiltered() {
  let ps = allProjects;
  if (halfFilter !== 'all') ps = ps.filter(p => p.half === halfFilter);
  if (teamFilter) ps = ps.filter(p => p.team === teamFilter);
  if (vaultOnly) ps = ps.filter(p => !!getVaultUrl(p.name));
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    ps = ps.filter(p => p.name.toLowerCase().includes(q) || (p.description || '').toLowerCase().includes(q));
  }
  return ps;
}

// ── Vault URL lookup ─────────────────────────────────────────────────────────
function getVaultUrl(projectName) {
  if (!projectName || !vaultUrls) return null;
  if (vaultUrls[projectName]) return vaultUrls[projectName];
  const lowerName = projectName.toLowerCase();
  for (const [key, url] of Object.entries(vaultUrls)) {
    if (key.toLowerCase() === lowerName) return url;
  }
  for (const [key, url] of Object.entries(vaultUrls)) {
    if (lowerName.includes(key.toLowerCase()) || key.toLowerCase().includes(lowerName)) {
      return url;
    }
  }
  return null;
}

// ── Render rows ───────────────────────────────────────────────────────────────
function render() {
  const labelsCol = document.getElementById('labels-col');
  const barsCol = document.getElementById('bars-col');

  Array.from(barsCol.querySelectorAll('.project-bar-row, .team-bar-row, .subteam-bar-row')).forEach(el => el.remove());
  labelsCol.innerHTML = '';

  const filtered = getFiltered();
  const grouped = {};
  for (const p of filtered) {
    const team = p.team || 'Unknown';
    if (!grouped[team]) grouped[team] = [];
    grouped[team].push(p);
  }

  let totalVisible = 0;

  for (const team of TEAMS) {
    const projects = grouped[team];
    if (!projects || projects.length === 0) continue;

    const isCollapsed = collapsed[team];

    // Team label row
    const teamLabel = document.createElement('div');
    teamLabel.className = 'team-header' + (isCollapsed ? ' collapsed' : '');
    teamLabel.innerHTML = `<span class="team-chevron">▾</span>${team} (${projects.length})`;
    teamLabel.addEventListener('click', () => {
      collapsed[team] = !collapsed[team];
      render();
    });
    labelsCol.appendChild(teamLabel);

    const teamBarRow = document.createElement('div');
    teamBarRow.className = 'team-bar-row';
    barsCol.appendChild(teamBarRow);

    if (isCollapsed) continue;

    const subGrouped = {};
    for (const p of projects) {
      const st = p.subTeam || 'General';
      if (!subGrouped[st]) subGrouped[st] = [];
      subGrouped[st].push(p);
    }
    const subTeams = Object.keys(subGrouped).sort((a, b) => {
      if (a === 'General') return 1;
      if (b === 'General') return -1;
      return a.localeCompare(b);
    });

    for (const st of subTeams) {
      const stProjects = subGrouped[st];
      stProjects.sort((a, b) => {
        const pa = PHASE_ORDER[getPhase(a)] ?? 9;
        const pb = PHASE_ORDER[getPhase(b)] ?? 9;
        return pa - pb;
      });

      if (subTeams.length > 1 || st !== 'General') {
        const stLabel = document.createElement('div');
        stLabel.className = 'subteam-header';
        stLabel.innerHTML = `<span class="subteam-dot"></span>${st}`;
        labelsCol.appendChild(stLabel);
        const stBar = document.createElement('div');
        stBar.className = 'subteam-bar-row';
        barsCol.appendChild(stBar);
      }

    for (const p of stProjects) {
      totalVisible += 1;
      const phase = getPhase(p);
      const phaseColor = PHASE_COLORS[phase] || '#cbd5e1';
      const isOffVault = phase === 'off-vault';

      const label = document.createElement('div');
      const isBacklog = phase === 'planned';
      const isGreyed = isOffVault || isBacklog;
      label.className = 'project-label' + (isGreyed ? ' dimmed' : '');
      label.dataset.id = p.id;
      const vaultUrl = getVaultUrl(p.name);
      const nameHtml = vaultUrl 
        ? `<a href="${vaultUrl}" target="_blank" class="project-name proj-link" title="${p.name}">${p.name} <i class="fas fa-external-link-alt vault-icon"></i></a>`
        : `<div class="project-name" title="${p.name}">${p.name}</div>`;
      const greyLabel = isBacklog
        ? '<span class="not-on-vault">backlog</span>'
        : (isOffVault ? '<span class="not-on-vault">off vault</span>' : '');
      const prio = (p.priority || '').toUpperCase();
      const prioPill = /^P[0-4]$/.test(prio)
        ? `<span class="prio-pill ${prio.toLowerCase()}">${prio}</span>`
        : '';
      label.innerHTML = `
        <div class="priority-dot" style="background:${phaseColor}"></div>
        ${nameHtml}
        ${prioPill}
        ${greyLabel}
        ${!isGreyed ? `<span class="phase-tag" style="color:${phaseColor}">${phase}</span>` : ''}
      `;
      labelsCol.appendChild(label);

      const barRow = document.createElement('div');
      barRow.className = 'project-bar-row' + (isGreyed ? ' dimmed' : '');

      let startDate = parseDate(p.startDate);
      let endDate = parseDate(p.shipping);
      if (!startDate && endDate) {
        startDate = new Date(endDate.getTime() - 56*24*60*60*1000);
      }
      if (startDate && !endDate) {
        endDate = new Date(startDate.getTime() + 56*24*60*60*1000);
      }
      if (startDate && endDate && startDate.getTime() === endDate.getTime()) {
        startDate = new Date(endDate.getTime() - 42*24*60*60*1000);
      }
      // Fallback: if a live project has no parseable dates, span 3 months from today
      // so the phase color is still visible in the timeline (no date label for fallbacks)
      let hasRealEndDate = !!endDate;
      if (!startDate && !endDate && !isGreyed) {
        const now = new Date();
        startDate = now;
        endDate = new Date(now.getTime() + 90*24*60*60*1000);
        hasRealEndDate = false;
      }

      if (startDate && endDate) {
        const sp = pct(startDate);
        const ep = pct(endDate);
        if (sp !== null && ep !== null) {
          const bar = document.createElement('div');
          bar.className = 'phase-bar';
          bar.dataset.phase = isGreyed ? 'planned' : phase;
          bar.style.left = sp + '%';
          bar.style.width = Math.max(1.5, ep - sp) + '%';
          barRow.appendChild(bar);

          // Date label after the bar end (only when we have a real shipping date)
          if (!isGreyed && hasRealEndDate) {
            const dateLabel = document.createElement('div');
            dateLabel.className = 'bar-date';
            dateLabel.style.left = ep + '%';
            dateLabel.textContent = endDate.toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
            barRow.appendChild(dateLabel);
          }
        }
      }

      barRow.addEventListener('mouseenter', (e) => showTooltip(e, p));
      barRow.addEventListener('mousemove', moveTooltip);
      barRow.addEventListener('mouseleave', hideTooltip);
      label.addEventListener('mouseenter', (e) => showTooltip(e, p));
      label.addEventListener('mousemove', moveTooltip);
      label.addEventListener('mouseleave', hideTooltip);

      barsCol.appendChild(barRow);
    }
    }
  }

  const totalPool = allProjects.filter(p =>
    halfFilter === 'all' || p.half === halfFilter
  ).length;
  document.getElementById('stats').textContent =
    `${totalVisible} project${totalVisible !== 1 ? 's' : ''}` +
    (totalPool !== totalVisible ? ` of ${totalPool}` : '');
}

// ── Tooltip ───────────────────────────────────────────────────────────────────
function showTooltip(e, p) {
  const tt = document.getElementById('tooltip');
  const phase = getPhase(p);
  const phaseColor = PHASE_COLORS[phase] || '#cbd5e1';
  tt.innerHTML = `
    <div class="tt-name">${p.name}</div>
    ${p.description ? `<div class="tt-tldr">${p.description}</div>` : ''}
    <div class="tt-meta">
      <span class="tt-badge" style="background:${phaseColor}22;color:${phaseColor};text-transform:capitalize">${phase}</span>
      <span class="tt-badge" style="background:var(--bg-input);color:var(--text-secondary)">${p.subTeam || p.team || '—'}</span>
      ${p.shipping ? `<span class="tt-badge" style="background:#16a34a22;color:#16a34a">Ships: ${p.shipping}</span>` : ''}
    </div>
  `;
  tt.classList.add('visible');
  moveTooltip(e);
}

function moveTooltip(e) {
  const tt = document.getElementById('tooltip');
  const x = e.clientX + 14;
  const y = e.clientY - 10;
  const w = tt.offsetWidth;
  const vw = window.innerWidth;
  tt.style.left = (x + w > vw ? x - w - 28 : x) + 'px';
  tt.style.top = y + 'px';
}

function hideTooltip() {
  document.getElementById('tooltip').classList.remove('visible');
}

// ── Parse projects ───────────────────────────────────────────────────────────
function parseProjects(rows) {
  if (!rows || rows.length < 2) return [];
  const headers = rows[0];
  const colIndex = {};
  headers.forEach((h, i) => { colIndex[h.toLowerCase().trim()] = i; });

  return rows.slice(1).map((row, idx) => {
    const get = (key) => {
      const i = colIndex[key.toLowerCase()];
      return i !== undefined ? (row[i] || '').trim() : '';
    };
    const name = get('project (ensure vault project is linked)') || get('project');
    if (!name) return null;
    return {
      id: idx + 1,
      name,
      description: get('description'),
      team: get('team'),
      subTeam: get('sub team') || get('subteam'),
      half: get('h'),
      priority: get('priority'),
      startDate: get('starts') || get('start date'),
      shipping: get('shipping'),
      editions: get('editions'),
      status: get('status'),
      phase: get('phase'),
      vaultStatus: get('vault status'),
    };
  }).filter(p => p !== null);
}

// ── Build team filter ────────────────────────────────────────────────────────
function buildTeamFilter() {
  const sel = document.getElementById('filter-team');
  sel.innerHTML = '<option value="">All Teams</option>';
  TEAMS.forEach(t => {
    const opt = document.createElement('option');
    opt.value = t;
    opt.textContent = t;
    sel.appendChild(opt);
  });
  sel.addEventListener('change', () => { teamFilter = sel.value; render(); });
}

// ── Search ────────────────────────────────────────────────────────────────────
document.getElementById('search').addEventListener('input', e => {
  searchQuery = e.target.value.trim();
  render();
});
document.getElementById('vault-only').addEventListener('change', e => {
  vaultOnly = e.target.checked;
  render();
});

// ── Load data ─────────────────────────────────────────────────────────────────
async function loadData() {
  try {
    const response = await fetch('data/projects.json');
    const data = await response.json();
    vaultUrls = data.vaultUrls || {};
    allProjects = parseProjects(data.rows);
    buildTeamFilter();
    renderWindowLabel();
    renderMonths();
    render();
  } catch (e) {
    document.getElementById('gantt-body').innerHTML = `<div class="empty">Failed to load data: ${e.message}</div>`;
  }
}

// ── Dark mode & sidebar toggle ────────────────────────────────────────────────
(function() {
  const toggle = document.getElementById('darkModeToggle');
  const sidebarToggle = document.getElementById('sidebarToggle');
  const sidebar = document.getElementById('sidebar');

  function updateDarkIcon() {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    const icon = toggle ? toggle.querySelector('i') : null;
    if (icon) icon.className = isDark ? 'fas fa-sun' : 'fas fa-moon';
  }

  if (toggle) {
    toggle.addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('pcb-theme', next);
      updateDarkIcon();
    });
    updateDarkIcon();
  }

  if (sidebarToggle && sidebar) {
    const saved = localStorage.getItem('pcb-sidebar-collapsed');
    if (saved === '1') sidebar.classList.add('collapsed');

    sidebarToggle.addEventListener('click', () => {
      sidebar.classList.toggle('collapsed');
      localStorage.setItem('pcb-sidebar-collapsed', sidebar.classList.contains('collapsed') ? '1' : '0');
    });
  }
})();

// ── Boot ──────────────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', loadData);
</script>
</body>
</html>
