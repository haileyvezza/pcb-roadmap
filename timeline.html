<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<title>Timeline — PCB Roadmap</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-primary: #f6f6f7; --bg-card: #ffffff; --bg-input: #f3f3f6;
    --bg-sidebar: #1a1a1f; --border: rgba(0,0,0,0.08); --border-hover: rgba(0,0,0,0.14);
    --text-primary: #1a1a1f; --text-secondary: #6b6b76; --text-muted: #9a9aa4;
    --accent-green: #0088FF; --accent-green-dim: rgba(0,136,255,0.08);
    --radius: 12px; --shadow-card: 0 1px 3px rgba(0,0,0,0.06);
    --font-sans: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --sidebar-width: 200px; --sidebar-collapsed: 56px;
    --proto: #a855f7; --build: #f59e0b; --release: #16a34a; --done: #94a3b8;
    --today: #dc2626; --label-w: 280px; --row-h: 34px; --tl-header: 40px;
  }

  [data-theme="dark"] {
    --bg-primary: #101114; --bg-card: #202227; --bg-input: #292C32;
    --bg-sidebar: #050506; --border: rgba(252,252,253,0.08); --border-hover: rgba(252,252,253,0.15);
    --text-primary: #FCFCFD; --text-secondary: #9DA1AE; --text-muted: #676D7E;
    --shadow-card: 0 1px 4px rgba(0,0,0,0.4);
  }

  body { background: var(--bg-primary); color: var(--text-primary); font-family: var(--font-sans); font-size: 13px; overflow: hidden; height: 100vh; display: flex; }

  .app-layout { display: flex; width: 100%; height: 100vh; overflow: hidden; }
  .sidebar { width: var(--sidebar-width); background: var(--bg-sidebar); display: flex; flex-direction: column; flex-shrink: 0; transition: width 0.2s ease; overflow: hidden; border-right: 1px solid rgba(255,255,255,0.05); }
  .sidebar.collapsed { width: var(--sidebar-collapsed); }
  .sidebar-header { display: flex; align-items: center; justify-content: space-between; padding: 16px 12px; border-bottom: 1px solid rgba(255,255,255,0.06); }
  .sidebar-brand { display: flex; align-items: center; gap: 8px; overflow: hidden; }
  .sidebar-logo { font-size: 18px; flex-shrink: 0; width: 28px; text-align: center; }
  .sidebar-title { font-size: 13px; font-weight: 700; color: #fff; transition: opacity 0.2s; white-space: nowrap; }
  .sidebar.collapsed .sidebar-title { opacity: 0; width: 0; }
  .sidebar-toggle { background: none; border: none; cursor: pointer; color: rgba(255,255,255,0.4); font-size: 11px; padding: 4px; border-radius: 4px; }
  .sidebar-toggle:hover { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.8); }
  .sidebar.collapsed .sidebar-header { justify-content: center; padding: 16px 0; }
  .sidebar.collapsed .sidebar-brand { display: none; }
  .sidebar-nav { display: flex; flex-direction: column; gap: 2px; padding: 10px 8px; }
  .sidebar-spacer { flex: 1; }
  .sidebar-bottom { display: flex; flex-direction: column; gap: 2px; padding: 10px 8px; border-top: 1px solid rgba(255,255,255,0.06); }
  .nav-item { display: flex; align-items: center; gap: 10px; padding: 8px 10px; border-radius: 8px; color: rgba(255,255,255,0.5); font-size: 12px; font-weight: 500; text-decoration: none; cursor: pointer; transition: background .15s, color .15s; position: relative; overflow: hidden; white-space: nowrap; }
  .nav-item::before { content: ''; position: absolute; left: 0; top: 50%; transform: translateY(-50%); width: 3px; height: 0; background: var(--accent-green); border-radius: 0 2px 2px 0; transition: height 0.2s; }
  .nav-item:hover { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.85); }
  .nav-item:hover::before { height: 14px; }
  .nav-item.active { background: rgba(0,136,255,0.15); color: var(--accent-green); font-weight: 600; }
  .nav-item.active::before { height: 20px; }
  .nav-item i { width: 16px; text-align: center; flex-shrink: 0; font-size: 13px; }
  .nav-label { transition: opacity 0.2s; }
  .sidebar.collapsed .nav-label { opacity: 0; width: 0; }
  .sidebar.collapsed .nav-item { justify-content: center; padding: 9px; gap: 0; }

  .main-content { flex: 1; min-width: 0; display: flex; flex-direction: column; overflow: hidden; }

  header { background: var(--bg-card); border-bottom: 1px solid var(--border); display: flex; flex-direction: column; flex-shrink: 0; }
  .header-row2 { display: flex; align-items: center; justify-content: space-between; padding: 0 20px; height: 42px; gap: 16px; background: var(--bg-primary); }
  .header-left { display: flex; align-items: center; gap: 14px; }
  .header-right { display: flex; align-items: center; gap: 10px; }
  .window-label { color: var(--muted); font-size: 12px; white-space: nowrap; }
  #stats { font-size: 11px; color: var(--muted); white-space: nowrap; }

  #legend { display: flex; align-items: center; gap: 14px; padding: 0 8px; }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--muted); }
  .legend-swatch { width: 10px; height: 10px; border-radius: 2px; }

  .type-toggle { display: flex; background: var(--bg-input); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .type-toggle button { padding: 4px 10px; font-size: 12px; font-weight: 500; color: var(--muted); background: transparent; border: none; cursor: pointer; transition: background .15s, color .15s; white-space: nowrap; }
  .type-toggle button:not(:last-child) { border-right: 1px solid var(--border); }
  .type-toggle button:hover { background: var(--border); color: var(--text-primary); }
  .type-toggle button.active { background: var(--accent-green); color: #fff; }

  #gantt-wrap { flex: 1; overflow: hidden; display: flex; flex-direction: column; }
  #tl-header { height: var(--tl-header); display: flex; flex-shrink: 0; border-bottom: 1px solid var(--border); background: var(--bg-card); }
  .label-spacer { width: var(--label-w); min-width: var(--label-w); border-right: 1px solid var(--border); display: flex; align-items: center; padding: 0 12px; gap: 8px; }
  #search { background: var(--bg-input); border: 1px solid var(--border); border-radius: 5px; color: var(--text-primary); font-size: 12px; padding: 3px 8px; width: 100%; outline: none; }
  #search::placeholder { color: var(--muted); }
  #months-row { flex: 1; position: relative; overflow: hidden; }
  .month-label { position: absolute; top: 0; height: 100%; display: flex; align-items: center; padding-left: 8px; font-size: 11px; color: var(--muted); font-weight: 500; border-left: 1px solid var(--border); pointer-events: none; }
  .month-label.current-month { color: var(--text-primary); }

  #gantt-body { flex: 1; overflow-y: auto; overflow-x: hidden; display: flex; }
  #labels-col { width: var(--label-w); min-width: var(--label-w); border-right: 1px solid var(--border); flex-shrink: 0; }
  #bars-col { flex: 1; position: relative; min-width: 0; }

  .grid-line { position: absolute; top: 0; bottom: 0; width: 1px; background: var(--border); pointer-events: none; }
  .grid-line.today-line { background: var(--today); width: 2px; z-index: 10; }

  .team-header { height: 32px; display: flex; align-items: center; padding: 0 12px; font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); background: var(--bg-input); border-bottom: 1px solid var(--border); cursor: pointer; user-select: none; gap: 6px; }
  .team-header:hover { filter: brightness(0.97); }
  .team-chevron { font-size: 9px; transition: transform .2s; }
  .team-header.collapsed .team-chevron { transform: rotate(-90deg); }
  .team-bar-row { height: 32px; background: var(--bg-input); border-bottom: 1px solid var(--border); }

  .project-label { height: var(--row-h); display: flex; align-items: center; padding: 0 8px 0 20px; border-bottom: 1px solid var(--border); cursor: pointer; transition: background .1s; gap: 6px; min-width: 0; }
  .project-label:hover { background: rgba(0,0,0,.04); }
  .project-name { font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; flex: 1; min-width: 0; }
  .priority-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }

  .project-bar-row { height: var(--row-h); position: relative; border-bottom: 1px solid var(--border); transition: background .1s; }
  .project-bar-row:hover { background: rgba(0,0,0,.03); }

  .phase-bar { position: absolute; height: 12px; top: 50%; transform: translateY(-50%); border-radius: 3px; opacity: .7; transition: opacity .15s; cursor: pointer; }
  .phase-bar:hover { opacity: 1; }
  .phase-bar[data-priority="P0"] { background: #ef4444; }
  .phase-bar[data-priority="P1"] { background: #f59e0b; }
  .phase-bar[data-priority="P2"] { background: #3b82f6; }
  .phase-bar[data-priority="P3"] { background: #22c55e; }
  .phase-bar[data-priority="P4"] { background: #94a3b8; }

  .editions-marker { position: absolute; top: 4px; bottom: 4px; width: 3px; border-radius: 2px; z-index: 5; }
  .editions-marker.s26 { background: #8b5cf6; }
  .editions-marker.w27 { background: #0891b2; }

  #tooltip { position: fixed; background: var(--bg-card); border: 1px solid var(--border); border-radius: 8px; padding: 10px 14px; max-width: 320px; pointer-events: none; z-index: 1000; box-shadow: 0 8px 24px rgba(0,0,0,.12); opacity: 0; transition: opacity .1s; }
  #tooltip.visible { opacity: 1; }
  .tt-name { font-weight: 600; font-size: 13px; margin-bottom: 4px; }
  .tt-desc { color: var(--muted); font-size: 11px; line-height: 1.5; margin-bottom: 6px; }
  .tt-meta { display: flex; gap: 8px; flex-wrap: wrap; }
  .tt-badge { font-size: 10px; padding: 2px 7px; border-radius: 10px; font-weight: 500; }

  .empty { padding: 40px; text-align: center; color: var(--muted); }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  [data-theme="dark"] .team-header { background: var(--bg-input); }
  [data-theme="dark"] .project-label:hover { background: rgba(255,255,255,0.04); }
  [data-theme="dark"] .project-bar-row:hover { background: rgba(255,255,255,0.02); }
</style>
</head>
<body>

<div class="app-layout">
<nav class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-brand">
      <span class="sidebar-logo">💳</span>
      <span class="sidebar-title">PCB Roadmap</span>
    </div>
    <button class="sidebar-toggle" id="sidebarToggle" title="Collapse"><i class="fas fa-chevron-left"></i></button>
  </div>
  <div class="sidebar-nav">
    <a href="index.html" class="nav-item">
      <i class="fas fa-table-cells"></i>
      <span class="nav-label">All Projects</span>
    </a>
    <a href="timeline.html" class="nav-item active">

      <i class="fas fa-external-link-alt"></i>

<div class="main-content">
<header>
  <div class="header-row2">
    <div class="header-left">
      <span class="window-label" id="window-label"></span>
      <span id="stats"></span>
      <div id="legend">
        <div class="legend-item"><div class="legend-swatch" style="background:#ef4444"></div>P0</div>
        <div class="legend-item"><div class="legend-swatch" style="background:#f59e0b"></div>P1</div>
        <div class="legend-item"><div class="legend-swatch" style="background:#3b82f6"></div>P2</div>
        <div class="legend-item"><div class="legend-swatch" style="background:#22c55e"></div>P3</div>
        <div class="legend-item"><div class="legend-swatch" style="background:#8b5cf6"></div>S26</div>
        <div class="legend-item"><div class="legend-swatch" style="background:#0891b2"></div>W27</div>
      </div>
    </div>
    <div class="header-right">
      <div class="type-toggle">
        <button id="type-h1" class="active" onclick="setHalfFilter('H1')">H1</button>
        <button id="type-h2" onclick="setHalfFilter('H2')">H2</button>
        <button id="type-all" onclick="setHalfFilter('all')">All</button>
      </div>
      <select id="filter-team" style="background:var(--bg-input);border:1px solid var(--border);border-radius:6px;color:var(--text-primary);font-size:12px;padding:4px 8px;outline:none;cursor:pointer;">
        <option value="">All Teams</option>
      </select>
    </div>
  </div>
</header>

<div id="gantt-wrap">
  <div id="tl-header">
    <div class="label-spacer">
      <input id="search" type="text" placeholder="Search projects…">
    </div>
    <div id="months-row"></div>
  </div>
  <div id="gantt-body">
    <div id="labels-col"></div>
    <div id="bars-col"></div>
  </div>
</div>
</div>
</div>
<div id="tooltip"></div>

<script>
const TEAMS = [
  'Money Movement and Expansion',
  'Payments Platform & Risk',
  'Cross Border',
  'Payment Merchant Experience',
  'Shop Wallet'
];

const PRIORITY_COLORS = {
  P0: '#ef4444', P1: '#f59e0b', P2: '#3b82f6', P3: '#22c55e', P4: '#94a3b8'
};

let allProjects = [];
let searchQuery = '';
let halfFilter = 'H1';
let teamFilter = '';
let collapsed = {};

// Window: Jan 1 2026 - Dec 31 2026
const WIN = {
  start: new Date(2026, 0, 1),
  end: new Date(2026, 11, 31),
  totalMs: new Date(2026, 11, 31) - new Date(2026, 0, 1)
};

function pct(date) {
  if (!date) return null;
  const d = typeof date === 'string' ? new Date(date) : date;
  return Math.max(0, Math.min(100, (d - WIN.start) / WIN.totalMs * 100));
}

function parseDate(str) {
  if (!str) return null;
  if (str.includes('Q1')) return new Date(2026, 2, 15);
  if (str.includes('Q2')) return new Date(2026, 5, 15);
  if (str.includes('Q3')) return new Date(2026, 8, 15);
  if (str.includes('Q4')) return new Date(2026, 11, 15);
  if (str.match(/^(Jan|Feb|Mar|Apr|May|Jun|Jul|Aug|Sep|Oct|Nov|Dec)/i)) {
    const d = new Date(str + ' 2026');
    return isNaN(d) ? null : d;
  }
  if (str.match(/^\d{1,2}\/\d{1,2}\/\d{4}/)) return new Date(str);
  return null;
}

function setHalfFilter(h) {
  halfFilter = h;
  ['h1', 'h2', 'all'].forEach(t => {
    document.getElementById('type-' + t).classList.toggle('active', t === h.toLowerCase());
  });
  render();
}

function renderWindowLabel() {
  const today = new Date().toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
  document.getElementById('window-label').textContent = `Jan 2026 – Dec 2026 · Today: ${today}`;
}

function renderMonths() {
  const row = document.getElementById('months-row');
  const barsCol = document.getElementById('bars-col');
  row.innerHTML = '';
  Array.from(barsCol.querySelectorAll('.grid-line')).forEach(el => el.remove());

  const months = [];
  let cur = new Date(WIN.start.getFullYear(), WIN.start.getMonth(), 1);
  const todayStr = new Date().toISOString().slice(0, 7);
  while (cur <= WIN.end) {
    months.push(new Date(cur));
    cur.setMonth(cur.getMonth() + 1);
  }

  months.forEach(m => {
    const p = pct(m);
    if (p === null || p > 100) return;
    const label = document.createElement('div');
    label.className = 'month-label' + (m.toISOString().slice(0,7) === todayStr ? ' current-month' : '');
    label.style.left = p + '%';
    label.textContent = m.toLocaleDateString('en-US', { month: 'short' });
    row.appendChild(label);

    const line = document.createElement('div');
    line.className = 'grid-line';
    line.style.left = p + '%';
    barsCol.appendChild(line);
  });

  const todayPct = pct(new Date());
  if (todayPct >= 0 && todayPct <= 100) {
    const tl = document.createElement('div');
    tl.className = 'grid-line today-line';
    tl.style.left = todayPct + '%';
    barsCol.appendChild(tl);
  }
}

function getFiltered() {
  let ps = allProjects;
  if (halfFilter !== 'all') ps = ps.filter(p => p.half === halfFilter);
  if (teamFilter) ps = ps.filter(p => p.team === teamFilter);
  if (searchQuery) {
    const q = searchQuery.toLowerCase();
    ps = ps.filter(p => p.name.toLowerCase().includes(q) || (p.description || '').toLowerCase().includes(q));
  }
  return ps;
}

function render() {
  const labelsCol = document.getElementById('labels-col');
  const barsCol = document.getElementById('bars-col');

  Array.from(barsCol.querySelectorAll('.project-bar-row, .team-bar-row')).forEach(el => el.remove());
  labelsCol.innerHTML = '';

  const filtered = getFiltered();
  const grouped = {};
  for (const p of filtered) {
    const team = p.team || 'Unknown';
    if (!grouped[team]) grouped[team] = [];
    grouped[team].push(p);
  }

  let total = 0;

  for (const team of TEAMS) {
    const projects = grouped[team];
    if (!projects || projects.length === 0) continue;

    const isCollapsed = collapsed[team];

    const teamLabel = document.createElement('div');
    teamLabel.className = 'team-header' + (isCollapsed ? ' collapsed' : '');
    teamLabel.innerHTML = `<span class="team-chevron">▾</span>${team} (${projects.length})`;
    teamLabel.addEventListener('click', () => { collapsed[team] = !collapsed[team]; render(); });
    labelsCol.appendChild(teamLabel);

    const teamBarRow = document.createElement('div');
    teamBarRow.className = 'team-bar-row';
    barsCol.appendChild(teamBarRow);

    if (isCollapsed) continue;

    projects.sort((a, b) => {
      const pa = { P0: 0, P1: 1, P2: 2, P3: 3, P4: 4 }[a.priority] ?? 9;
      const pb = { P0: 0, P1: 1, P2: 2, P3: 3, P4: 4 }[b.priority] ?? 9;
      return pa - pb;
    });

    for (const p of projects) {
      total++;
      const prioColor = PRIORITY_COLORS[p.priority] || '#94a3b8';

      const label = document.createElement('div');
      label.className = 'project-label';
      label.innerHTML = `
        <div class="priority-dot" style="background:${prioColor}"></div>
        <div class="project-name" title="${p.name}">${p.name}</div>
      `;
      labelsCol.appendChild(label);

      const barRow = document.createElement('div');
      barRow.className = 'project-bar-row';

      const startDate = parseDate(p.startDate) || parseDate(p.shipping);
      const endDate = parseDate(p.shipping) || (startDate ? new Date(startDate.getTime() + 60*24*60*60*1000) : null);

      if (startDate && endDate) {
        const sp = pct(startDate);
        const ep = pct(endDate);
        if (sp !== null && ep !== null && ep > sp) {
          const bar = document.createElement('div');
          bar.className = 'phase-bar';
          bar.dataset.priority = p.priority;
          bar.style.left = sp + '%';
          bar.style.width = Math.max(2, ep - sp) + '%';
          barRow.appendChild(bar);
        }
      }

      // Editions markers
      const ed = (p.editions || '').toUpperCase();
      if (ed.includes('S26')) {
        const marker = document.createElement('div');
        marker.className = 'editions-marker s26';
        marker.style.left = pct(new Date(2026, 4, 1)) + '%';
        marker.title = 'Spring Editions 2026';
        barRow.appendChild(marker);
      }
      if (ed.includes('W27')) {
        const marker = document.createElement('div');
        marker.className = 'editions-marker w27';
        marker.style.left = pct(new Date(2026, 10, 1)) + '%';
        marker.title = 'Winter Editions 2027';
        barRow.appendChild(marker);
      }

      barRow.addEventListener('mouseenter', (e) => showTooltip(e, p));
      barRow.addEventListener('mousemove', moveTooltip);
      barRow.addEventListener('mouseleave', hideTooltip);
      label.addEventListener('mouseenter', (e) => showTooltip(e, p));
      label.addEventListener('mousemove', moveTooltip);
      label.addEventListener('mouseleave', hideTooltip);

      barsCol.appendChild(barRow);
    }
  }

  document.getElementById('stats').textContent = `${total} projects`;
}

function showTooltip(e, p) {
  const tt = document.getElementById('tooltip');
  const prioColor = PRIORITY_COLORS[p.priority] || '#94a3b8';
  const ed = (p.editions || '').toUpperCase();
  const edBadge = ed.includes('S26') ? '<span class="tt-badge" style="background:#8b5cf622;color:#8b5cf6">S26</span>' :
                  ed.includes('W27') ? '<span class="tt-badge" style="background:#0891b222;color:#0891b2">W27</span>' : '';
  tt.innerHTML = `
    <div class="tt-name">${p.name}</div>
    ${p.description ? `<div class="tt-desc">${p.description}</div>` : ''}
    <div class="tt-meta">
      <span class="tt-badge" style="background:${prioColor}22;color:${prioColor}">${p.priority || '—'}</span>
      <span class="tt-badge" style="background:var(--bg-input);color:var(--text-secondary)">${p.subTeam || p.team || '—'}</span>
      ${p.shipping ? `<span class="tt-badge" style="background:#16a34a22;color:#16a34a">Ships: ${p.shipping}</span>` : ''}
      ${edBadge}
    </div>
  `;
  tt.classList.add('visible');
  moveTooltip(e);
}

function moveTooltip(e) {
  const tt = document.getElementById('tooltip');
  const x = e.clientX + 14;
  const y = e.clientY - 10;
  const w = tt.offsetWidth;
  const vw = window.innerWidth;
  tt.style.left = (x + w > vw ? x - w - 28 : x) + 'px';
  tt.style.top = y + 'px';
}

function hideTooltip() {
  document.getElementById('tooltip').classList.remove('visible');
}

function parseProjects(rows) {
  if (!rows || rows.length < 2) return [];
  const headers = rows[0];
  const colIndex = {};
  headers.forEach((h, i) => { colIndex[h.toLowerCase().trim()] = i; });

  return rows.slice(1).map((row, idx) => {
    const get = (key) => {
      const i = colIndex[key.toLowerCase()];
      return i !== undefined ? (row[i] || '').trim() : '';
    };
    const name = get('project (ensure vault project is linked)') || get('project');
    if (!name) return null;
    return {
      id: idx + 1,
      name,
      description: get('description'),
      team: get('team'),
      subTeam: get('sub team') || get('subteam'),
      half: get('h'),
      priority: get('priority'),
      startDate: get('starts') || get('start date'),
      shipping: get('shipping'),
      editions: get('editions'),
      status: get('status'),
    };
  }).filter(p => p !== null);
}

function buildTeamFilter() {
  const sel = document.getElementById('filter-team');
  sel.innerHTML = '<option value="">All Teams</option>';
  TEAMS.forEach(t => {
    const opt = document.createElement('option');
    opt.value = t;
    opt.textContent = t;
    sel.appendChild(opt);
  });
  sel.addEventListener('change', () => { teamFilter = sel.value; render(); });
}

document.getElementById('search').addEventListener('input', e => {
  searchQuery = e.target.value.trim();
  render();
});

async function loadData() {
  try {
    const response = await fetch('data/projects.json');
    const data = await response.json();
    allProjects = parseProjects(data.rows);
    buildTeamFilter();
    renderWindowLabel();
    renderMonths();
    render();
  } catch (e) {
    document.getElementById('gantt-body').innerHTML = `<div class="empty">Failed to load data: ${e.message}</div>`;
  }
}

(function() {
  const toggle = document.getElementById('darkModeToggle');
  const sidebarToggle = document.getElementById('sidebarToggle');
  const sidebar = document.getElementById('sidebar');

  function updateDarkIcon() {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    const icon = toggle ? toggle.querySelector('i') : null;
    if (icon) icon.className = isDark ? 'fas fa-sun' : 'fas fa-moon';
  }

  if (toggle) {
    toggle.addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('pcb-theme', next);
      updateDarkIcon();
    });
    const saved = localStorage.getItem('pcb-theme');
    const sys = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', saved || sys);
    updateDarkIcon();
  }

  if (sidebarToggle && sidebar) {
    const saved = localStorage.getItem('pcb-sidebar-collapsed');
    if (saved === '1') sidebar.classList.add('collapsed');
    sidebarToggle.addEventListener('click', () => {
      sidebar.classList.toggle('collapsed');
      localStorage.setItem('pcb-sidebar-collapsed', sidebar.classList.contains('collapsed') ? '1' : '0');
    });
  }
})();

document.addEventListener('DOMContentLoaded', loadData);
</script>
