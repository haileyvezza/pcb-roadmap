<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<title>Roadmap — PCB</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-primary:  #f6f6f7;
    --bg-card:     #ffffff;
    --bg-input:    #f3f3f6;
    --bg-sidebar:  #ffffff;
    --border:      rgba(0,0,0,0.08);
    --border-hover: rgba(0,0,0,0.14);
    --text-primary: #1a1a1f;
    --text-secondary: #6b6b76;
    --text-muted:  #9a9aa4;
    --accent-green: #0088FF;
    --accent-green-dim: rgba(0,136,255,0.08);
    --accent-green-hover: #0066FF;
    --radius:      12px;
    --radius-sm:   8px;
    --shadow:      0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
    --shadow-card: 0 1px 3px rgba(0,0,0,0.06);
    --shadow-lg:   0 8px 30px rgba(0,0,0,0.08);
    --font-sans:   'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --sidebar-width: 200px;
    --sidebar-collapsed: 56px;
    --filter-h:  48px;
  }

  [data-theme="dark"] {
    --bg-primary:  #101114;
    --bg-card:     #202227;
    --bg-input:    #292C32;
    --bg-sidebar:  #1a1a1f;
    --border:      rgba(252,252,253,0.08);
    --border-hover: rgba(252,252,253,0.15);
    --text-primary: #FCFCFD;
    --text-secondary: #9DA1AE;
    --text-muted:  #676D7E;
    --shadow:      0 1px 3px rgba(0,0,0,0.4);
    --shadow-card: 0 1px 4px rgba(0,0,0,0.4);
    --shadow-lg:   0 8px 30px rgba(0,0,0,0.5);
  }

  body { background: var(--bg-primary); color: var(--text-primary); font-family: var(--font-sans); font-size: 13px; height: 100vh; display: flex; flex-direction: row; overflow: hidden; }

  header {
    background: var(--bg-card);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    flex-shrink: 0;
    gap: 16px;
    height: 56px;
  }
  .header-left { display: flex; align-items: center; gap: 16px; }
  .header-right { display: flex; align-items: center; gap: 12px; }

  #refresh-btn {
    padding: 5px 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg-input);
    color: var(--text-secondary);
    font-size: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all .15s;
    white-space: nowrap;
  }
  #refresh-btn:hover { border-color: var(--border-hover); color: var(--text-primary); }

  #filter-bar {
    height: var(--filter-h);
    background: var(--bg-card);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    padding: 0 12px;
    gap: 5px;
    flex-shrink: 0;
    overflow: visible;
  }
  #filter-bar select, #filter-bar input[type="text"] {
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--text-primary);
    font-size: 11px;
    padding: 3px 6px;
    outline: none;
    cursor: pointer;
    white-space: nowrap;
    flex-shrink: 0;
    max-width: 110px;
  }
  #filter-bar select option { background: var(--bg-input); }
  #search-input { width: 140px; flex-shrink: 0; max-width: none; }
  .filter-sep { width: 1px; height: 16px; background: var(--border); flex-shrink: 0; }
  #clear-btn {
    font-size: 10px;
    color: var(--text-muted);
    cursor: pointer;
    background: none;
    border: none;
    padding: 3px 5px;
    border-radius: 4px;
    flex-shrink: 0;
  }
  #clear-btn:hover { color: var(--text-primary); background: var(--bg-input); }
  #row-count { font-size: 10px; color: var(--text-muted); margin-left: auto; white-space: nowrap; flex-shrink: 0; }

  /* Multi-select dropdown */
  .multi-select-dropdown { position: relative; display: inline-block; flex-shrink: 0; }
  .multi-select-trigger {
    background: var(--bg-input);
    border: 1px solid var(--border);
    border-radius: 5px;
    color: var(--text-primary);
    font-size: 11px;
    padding: 3px 6px;
    cursor: pointer;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 3px;
  }
  .multi-select-trigger:hover { border-color: var(--border-hover); }
  .multi-select-trigger.active { border-color: var(--accent-green); background: var(--accent-green-dim); }
  .dropdown-arrow { font-size: 9px; color: var(--text-muted); }
  .multi-select-panel {
    display: none;
    position: absolute;
    top: calc(100% + 4px);
    left: 0;
    z-index: 100;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 8px;
    box-shadow: var(--shadow-lg);
    padding: 6px 0;
    min-width: 180px;
    max-height: 280px;
    overflow-y: auto;
  }
  .multi-select-panel.open { display: block; }
  .multi-select-option {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 6px 12px;
    font-size: 12px;
    cursor: pointer;
    color: var(--text-primary);
    user-select: none;
  }
  .multi-select-option:hover { background: var(--bg-input); }
  .multi-select-option input[type="checkbox"] { accent-color: var(--accent-green); cursor: pointer; }
  .multi-select-option.selected { background: var(--accent-green-dim); }
  .multi-select-option.select-all { border-bottom: 1px solid var(--border); margin-bottom: 4px; padding-bottom: 8px; font-weight: 600; }
  .multi-select-option.select-all.partial { color: var(--text-muted); }

  #table-wrap { flex: 1; overflow: auto; }
  table { width: 100%; border-collapse: collapse; min-width: 1600px; }
  thead { position: sticky; top: 0; z-index: 10; }
  th {
    text-align: left;
    padding: 8px 12px;
    font-size: 11px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: .05em;
    color: var(--text-muted);
    background: var(--bg-card);
    border-bottom: 1px solid var(--border);
    white-space: nowrap;
    user-select: none;
    cursor: pointer;
  }
  th:hover { color: var(--text-primary); }
  th .sort-arrow { font-size: 9px; margin-left: 3px; opacity: .4; }
  th.sorted .sort-arrow { opacity: 1; color: var(--accent-green); }
  th.nosort { cursor: default; }
  th.nosort:hover { color: var(--text-muted); }

  td {
    padding: 7px 12px;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    vertical-align: middle;
  }
  tr:hover td { background: var(--bg-input); }

  .muted-cell { color: var(--text-muted); }
  .cell-with-flag { display: inline-flex; align-items: center; gap: 5px; }
  .change-flag {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    color: #dc2626;
    font-size: 10px;
    line-height: 1;
    cursor: help;
    flex-shrink: 0;
    padding: 2px;
  }
  [data-theme="dark"] .change-flag { color: #f87171; }
  #change-tooltip {
    position: fixed;
    z-index: 9999;
    background: #1a1a1f;
    color: #fff;
    font-size: 11px;
    font-weight: 500;
    font-family: var(--font-sans);
    line-height: 1.35;
    padding: 7px 10px;
    border-radius: 6px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.25);
    pointer-events: none;
    opacity: 0;
    transform: translateY(2px);
    transition: opacity .12s ease, transform .12s ease;
    max-width: 280px;
    white-space: normal;
  }
  #change-tooltip.visible {
    opacity: 1;
    transform: translateY(0);
  }
  [data-theme="dark"] #change-tooltip {
    background: #f6f6f7;
    color: #1a1a1f;
  }
  .col-name { min-width: 280px; max-width: none; white-space: normal; }
  .proj-name-cell { overflow: visible; text-overflow: unset; white-space: normal; max-width: none; line-height: 1.35; }
  a.proj-link { color: var(--text-primary); text-decoration: none; }
  a.proj-link:hover { color: var(--accent-green); text-decoration: underline; }
  .vault-icon { font-size: 9px; margin-left: 4px; opacity: 0.5; }
  a.proj-link:hover .vault-icon { opacity: 1; }
  .not-on-vault { font-size: 10px; color: var(--text-muted); font-style: italic; }

  /* Priority badges */
  .priority-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 600;
    white-space: nowrap;
  }
  .priority-p0 { background: #fee2e2; color: #b91c1c; }
  .priority-p1 { background: #fef3c7; color: #b45309; }
  .priority-p2 { background: #dbeafe; color: #1d4ed8; }
  .priority-p3 { background: #dcfce7; color: #15803d; }
  .priority-p4 { background: #f1f5f9; color: #475569; }

  /* Status badges */
  .status-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 500;
    white-space: nowrap;
  }
  .status-in-progress { background: #dbeafe; color: #1d4ed8; }
  .status-complete { background: #dcfce7; color: #15803d; }
  .status-shipped { background: #dcfce7; color: #15803d; }
  .status-stopped { background: #fee2e2; color: #b91c1c; }
  .status-backlog { background: #f1f5f9; color: #475569; }
  .status-paused { background: #fef3c7; color: #b45309; }

  /* Theme pills */
  .theme-pill {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 10px;
    font-weight: 500;
    white-space: nowrap;
    max-width: 180px;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Editions badge */
  .editions-badge {
    display: inline-block;
    padding: 2px 6px;
    border-radius: 6px;
    font-size: 10px;
    font-weight: 600;
    white-space: nowrap;
  }
  .editions-s26 { background: #8b5cf6; color: #fff; }
  .editions-w27 { background: #0891b2; color: #fff; }
  .editions-no { background: #f1f5f9; color: #64748b; }

  /* Team badge */
  .team-badge {
    display: inline-block;
    padding: 2px 6px;
    border-radius: 6px;
    font-size: 10px;
    font-weight: 500;
    white-space: nowrap;
    background: var(--bg-input);
    color: var(--text-secondary);
    max-width: 180px;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* Partner badge */
  .partner-badge {
    display: inline-block;
    padding: 2px 6px;
    border-radius: 6px;
    font-size: 10px;
    font-weight: 500;
    white-space: nowrap;
    background: #fef3c7;
    color: #b45309;
    max-width: 120px;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .empty-state { padding: 60px; text-align: center; color: var(--text-muted); }

  /* Sidebar */
  .app-layout { display: flex; height: 100vh; overflow: hidden; width: 100%; }
  .sidebar {
    width: var(--sidebar-width);
    background: var(--bg-sidebar);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    transition: width 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    overflow: hidden;
    z-index: 100;
    border-right: 1px solid var(--border);
  }
  .sidebar.collapsed { width: var(--sidebar-collapsed); }
  .sidebar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 14px;
    border-bottom: 1px solid var(--border);
    min-height: 56px;
  }
  .sidebar-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    overflow: hidden;
    white-space: nowrap;
  }
  .sidebar-logo { font-size: 18px; flex-shrink: 0; width: 28px; text-align: center; }
  .sidebar-title { font-size: 13px; font-weight: 700; color: var(--text-primary); letter-spacing: -0.01em; transition: opacity 0.2s; white-space: nowrap; }
  .sidebar.collapsed .sidebar-title { opacity: 0; width: 0; }
  .sidebar-toggle {
    background: none; border: none; color: var(--text-muted);
    cursor: pointer; padding: 6px; border-radius: 6px;
    transition: all 0.15s; flex-shrink: 0; font-size: 11px;
  }
  .sidebar-toggle:hover { background: var(--bg-input); color: var(--text-primary); }
  .sidebar.collapsed .sidebar-header { justify-content: center; padding: 16px 0; }
  .sidebar.collapsed .sidebar-brand { display: none; }
  .sidebar-nav {
    padding: 10px 8px;
    display: flex; flex-direction: column; gap: 2px;
  }
  .sidebar-spacer { flex: 1; }
  .sidebar-bottom {
    padding: 8px 8px 16px;
    display: flex; flex-direction: column; gap: 2px;
    border-top: 1px solid var(--border);
  }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 12px; border-radius: 8px; cursor: pointer;
    color: var(--text-secondary); transition: all 0.15s;
    white-space: nowrap; overflow: hidden;
    font-size: 13px; font-weight: 500;
    text-decoration: none; position: relative;
  }
  .nav-item::before {
    content: ''; position: absolute; left: 0; top: 50%;
    transform: translateY(-50%); width: 3px; height: 0;
    border-radius: 0 2px 2px 0; background: var(--accent-green);
    transition: height 0.2s;
  }
  .nav-item:hover { background: var(--bg-input); color: var(--text-primary); }
  .nav-item:hover::before { height: 14px; }
  .nav-item.active { background: rgba(0,136,255,0.08); color: var(--accent-green); font-weight: 600; }
  .nav-item.active::before { height: 20px; }
  .nav-item i { width: 16px; text-align: center; flex-shrink: 0; font-size: 13px; }
  .nav-label { transition: opacity 0.2s; }
  .sidebar.collapsed .nav-label { opacity: 0; width: 0; }
  .sidebar.collapsed .nav-item { justify-content: center; padding: 9px; gap: 0; }
  .sidebar.collapsed .sidebar-nav,
  .sidebar.collapsed .sidebar-bottom { padding-left: 0; padding-right: 0; align-items: center; }
  .nav-sub { display: flex; flex-direction: column; gap: 1px; margin-top: 1px; }
  .nav-sub-item { display: flex; align-items: center; gap: 8px; padding: 7px 10px 7px 32px; border-radius: 8px; cursor: pointer; color: var(--text-muted); font-size: 12px; font-weight: 500; text-decoration: none; transition: all 0.15s; white-space: nowrap; overflow: hidden; }
  .nav-sub-item:hover { background: var(--bg-input); color: var(--text-primary); }
  .nav-sub-item.active { color: var(--accent-green); font-weight: 600; }
  .nav-item.parent-active { color: var(--text-primary); }
  .sidebar.collapsed .nav-sub { display: none; }

  .main-content {
    flex: 1; min-width: 0;
    display: flex; flex-direction: column;
    overflow: hidden;
    background: var(--bg-primary);
  }

  [data-theme="dark"] th { background: var(--bg-card); }
  [data-theme="dark"] tr:hover td { background: var(--bg-input); }
  [data-theme="dark"] #filter-bar { background: var(--bg-card); }
  [data-theme="dark"] #filter-bar select,
  [data-theme="dark"] #filter-bar input[type="text"] { background: var(--bg-input); color: var(--text-primary); border-color: var(--border); }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .loading-spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid var(--border);
    border-top-color: var(--accent-green);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .desc-cell {
    max-width: 320px;
    min-width: 180px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    color: var(--text-secondary);
    font-size: 12px;
  }
  .desc-cell:hover {
    white-space: normal;
    overflow: visible;
    position: relative;
    z-index: 5;
    background: var(--bg-card);
    padding: 8px;
    border-radius: 4px;
    box-shadow: var(--shadow-lg);
    max-width: 400px;
    color: var(--text-primary);
  }

  .source-link {
    font-size: 11px;
    color: var(--text-muted);
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .source-link:hover { color: var(--accent-green); }
</style>
</head>
<body>

<div class="app-layout">

<nav class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-brand">
      <span class="sidebar-logo">💳</span>
      <span class="sidebar-title">PCB Roadmap</span>
    </div>
    <button class="sidebar-toggle" id="sidebarToggle" title="Collapse"><i class="fas fa-chevron-left"></i></button>
  </div>
  <div class="sidebar-nav">
    <a href="https://pcb-hub.quick.shopify.io/" class="nav-item">
      <i class="fas fa-house"></i>
      <span class="nav-label">PCB Hub</span>
    </a>
    <a href="timeline.html" class="nav-item parent-active">
      <i class="fas fa-chart-gantt"></i>
      <span class="nav-label">Roadmap Calendar</span>
    </a>
    <div class="nav-sub">
      <a href="index.html" class="nav-sub-item active">
        <i class="fas fa-table-cells"></i>
        <span class="nav-label">Roadmap</span>
      </a>
      <a href="themes.html" class="nav-sub-item">
        <i class="fas fa-layer-group"></i>
        <span class="nav-label">By Theme</span>
      </a>
      <a href="performance.html" class="nav-sub-item">
        <i class="fas fa-chart-line"></i>
        <span class="nav-label">Performance to Plan</span>
      </a>
      <a href="calendar.html" class="nav-sub-item">
        <i class="fas fa-calendar-days"></i>
        <span class="nav-label">Release Calendar</span>
      </a>
      <a href="weekly.html" class="nav-sub-item">
        <i class="fas fa-bolt"></i>
        <span class="nav-label">Weekly Snapshot</span>
      </a>
    </div>
  </div>
  <div class="sidebar-spacer"></div>
  <div class="sidebar-bottom">
    <a href="https://docs.google.com/spreadsheets/d/17xd1aWdtf33kUk3giF5WyC4dJpbClOjPGh2cVMYiuvI" target="_blank" class="source-link" style="padding: 9px 12px;">
      <i class="fas fa-external-link-alt"></i>
      <span class="nav-label">Source Sheet</span>
    </a>
    <div class="nav-item" id="darkModeToggle">
      <i class="fas fa-moon"></i>
      <span class="nav-label">Dark Mode</span>
    </div>
  </div>
</nav>

<div class="main-content">
<header>
  <div class="header-left">
    <span style="font-weight: 600; font-size: 15px;">PCB Stack Ranked 2026 H1 + H2 Priorities</span>
  </div>
  <div class="header-right">
    <button id="refresh-btn"><i class="fas fa-sync-alt"></i> Refresh</button>
  </div>
</header>

<div id="filter-bar">
  <input id="search-input" type="text" placeholder="Search projects…">
  <div class="filter-sep"></div>
  <div class="multi-select-dropdown" data-filter="priority">
    <button type="button" class="multi-select-trigger">Priority <span class="dropdown-arrow">▾</span></button>
    <div class="multi-select-panel"></div>
  </div>
  <div class="multi-select-dropdown" data-filter="team">
    <button type="button" class="multi-select-trigger">Team <span class="dropdown-arrow">▾</span></button>
    <div class="multi-select-panel"></div>
  </div>
  <div class="multi-select-dropdown" data-filter="theme">
    <button type="button" class="multi-select-trigger">Theme <span class="dropdown-arrow">▾</span></button>
    <div class="multi-select-panel"></div>
  </div>
  <div class="multi-select-dropdown" data-filter="phase">
    <button type="button" class="multi-select-trigger">Phase <span class="dropdown-arrow">▾</span></button>
    <div class="multi-select-panel"></div>
  </div>
  <div class="multi-select-dropdown" data-filter="status">
    <button type="button" class="multi-select-trigger">Status <span class="dropdown-arrow">▾</span></button>
    <div class="multi-select-panel"></div>
  </div>
  <div class="multi-select-dropdown" data-filter="editions">
    <button type="button" class="multi-select-trigger">Editions <span class="dropdown-arrow">▾</span></button>
    <div class="multi-select-panel"></div>
  </div>
  <div class="multi-select-dropdown" data-filter="partners">
    <button type="button" class="multi-select-trigger">Partner <span class="dropdown-arrow">▾</span></button>
    <div class="multi-select-panel"></div>
  </div>
  <div class="multi-select-dropdown" data-filter="partnerTeams">
    <button type="button" class="multi-select-trigger">Partner Teams <span class="dropdown-arrow">▾</span></button>
    <div class="multi-select-panel"></div>
  </div>
  <div class="multi-select-dropdown" data-filter="subTeam">
    <button type="button" class="multi-select-trigger">Sub Team <span class="dropdown-arrow">▾</span></button>
    <div class="multi-select-panel"></div>
  </div>
  <label id="show-done-label" title="Done projects are hidden by default — tick this to include them" style="display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--text-secondary);cursor:pointer;white-space:nowrap;margin-left:4px;padding:5px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg-input);">
    <input type="checkbox" id="show-done-toggle" style="cursor:pointer;margin:0;"> Show Done
  </label>
  <label id="flagged-only-label" title="Show only projects with Priority, Target GA, or End Date changes since Jul 2" style="display:flex;align-items:center;gap:6px;font-size:12px;font-weight:600;color:var(--text-secondary);cursor:pointer;white-space:nowrap;padding:5px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg-input);">
    <input type="checkbox" id="flagged-only-toggle" style="cursor:pointer;margin:0;">
    <i class="fas fa-flag" style="color:#dc2626;font-size:10px;" aria-hidden="true"></i> Flagged only
  </label>
  <button id="clear-btn">Clear</button>
  <span id="row-count"></span>
</div>

<div id="table-wrap">
  <div class="empty-state"><span class="loading-spinner"></span> Loading data from Google Sheets…</div>
</div>
<div id="stopped-section" style="padding:0 16px 24px;"></div>
</div>

</div>

<script>
// Google Sheets configuration
const SPREADSHEET_ID = '17xd1aWdtf33kUk3giF5WyC4dJpbClOjPGh2cVMYiuvI';
const SHEET_NAME = 'Editions 2026 Rohit Review';
const SHEETS_API_KEY = ''; // Add your API key here for public access, or leave empty for manual data load

// Theme colors for visual distinction
const THEME_COLORS = {
  '~100% Shopify Payments': { bg: '#dbeafe', color: '#1d4ed8' },
  'Defend merchants and Shopify from bad actors': { bg: '#fee2e2', color: '#b91c1c' },
  'Set a new standard for baseline quality': { bg: '#dcfce7', color: '#15803d' },
  'Own our Money Infra': { bg: '#fef3c7', color: '#b45309' },
  'Make Shop Pay the dominant buyer wallet for commerce': { bg: '#f3e8ff', color: '#7c3aed' },
  'Enable merchants to sell to buyers anywhere in the world': { bg: '#cffafe', color: '#0891b2' },
  'Shopify Payments Always On': { bg: '#fce7f3', color: '#be185d' },
  'Eng and Infra Excellence': { bg: '#e0e7ff', color: '#4338ca' },
};

const PRIORITY_ORDER = { P0: 0, P1: 1, P2: 2, P3: 3, P4: 4 };

let allProjects = [];
let vaultUrls = {};
let changeMap = {}; // key: "Team||Project" → { priority?, targetGa?, endDate? }
let filters = { 
  search: '', 
  half: [],
  priority: [], 
  team: [], 
  theme: [], 
  phase: [],
  status: [], 
  editions: [], 
  partners: [],
  partnerTeams: [],
  subTeam: []
};
let sortCol = 'startDate', sortDir = 1;
let showDone = false;
let flaggedOnly = false;

// Helper used both for the Work Starts cell and for sorting:
// prefer Vault's actual Starts when a Vault project is linked,
// otherwise fall back to Ship Month from the sheet.
function getWorkStarts(p) {
  const hasVault = !!getVaultUrl(p.name);
  return hasVault
    ? (p.startDate || p.shipMonth || '')
    : (p.shipMonth || p.startDate || '');
}

function getEndDate(p) {
  return (p.shipping || p.shipMonth || '').trim();
}

function changeKey(p) {
  return `${(p.team || '').trim()}||${(p.name || '').trim()}`;
}

function hasChangeFlag(p) {
  return !!changeMap[changeKey(p)];
}

function changeFlagHtml(p, field, label) {
  const entry = changeMap[changeKey(p)];
  if (!entry || !entry[field]) return '';
  const { from, to } = entry[field];
  const tip = `${label}: ${from} → ${to}`;
  const escaped = tip
    .replace(/&/g, '&amp;')
    .replace(/"/g, '&quot;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;');
  return `<span class="change-flag" tabindex="0" role="img" data-tip="${escaped}" aria-label="${escaped}"><i class="fas fa-flag" aria-hidden="true"></i></span>`;
}

function flaggedCell(innerHtml, p, field, label) {
  const flag = changeFlagHtml(p, field, label);
  if (!flag) return innerHtml;
  return `<span class="cell-with-flag">${innerHtml}${flag}</span>`;
}

function ensureChangeTooltip() {
  let tip = document.getElementById('change-tooltip');
  if (!tip) {
    tip = document.createElement('div');
    tip.id = 'change-tooltip';
    document.body.appendChild(tip);
  }
  return tip;
}

function bindChangeFlagTooltips(root) {
  const tip = ensureChangeTooltip();
  const show = (el) => {
    const text = el.getAttribute('data-tip') || el.getAttribute('aria-label') || '';
    if (!text) return;
    tip.textContent = text;
    const rect = el.getBoundingClientRect();
    const tipWidth = Math.min(280, window.innerWidth - 16);
    let left = rect.left;
    if (left + tipWidth > window.innerWidth - 8) left = window.innerWidth - tipWidth - 8;
    if (left < 8) left = 8;
    let top = rect.bottom + 8;
    tip.style.width = 'auto';
    tip.style.left = `${left}px`;
    tip.style.top = `${top}px`;
    tip.classList.add('visible');
    // If tooltip would go off bottom, flip above
    requestAnimationFrame(() => {
      const tipRect = tip.getBoundingClientRect();
      if (tipRect.bottom > window.innerHeight - 8) {
        tip.style.top = `${Math.max(8, rect.top - tipRect.height - 8)}px`;
      }
    });
  };
  const hide = () => tip.classList.remove('visible');
  root.querySelectorAll('.change-flag').forEach(el => {
    el.addEventListener('mouseenter', () => show(el));
    el.addEventListener('mouseleave', hide);
    el.addEventListener('focus', () => show(el));
    el.addEventListener('blur', hide);
  });
}

// Best-effort parse of human date strings (e.g. "Jul 1, 2026", "12/1/2026")
// into a comparable timestamp. Free-text values fall back to +Infinity so
// they sort last in ascending order.
function parseSortableDate(s) {
  if (!s) return Number.POSITIVE_INFINITY;
  const d = new Date(s);
  if (!isNaN(d)) return d.getTime();
  return Number.POSITIVE_INFINITY;
}

function isDoneProject(p) {
  const status = (p.status || '').toLowerCase();
  if (status === 'done' || status === 'complete' || status === 'completed') return true;
  const phase = (p.phase || '').toLowerCase();
  if (phase === 'done' || phase === 'complete' || phase === 'completed') return true;
  return false;
}

function isStoppedProject(p) {
  const phase = (p.phase || '').toLowerCase();
  if (phase === 'stopped' || phase === 'paused' || phase === 'blocked') return true;
  const status = (p.status || '').toLowerCase();
  if (status === 'stopped' || status === 'paused' || status === 'blocked') return true;
  return false;
}

// Filter configuration
const FILTER_CONFIG = {
  half: { label: 'H', field: 'half', fixedOptions: ['H1', 'H2'] },
  priority: { label: 'Priority', field: 'priority', fixedOptions: ['P0', 'P1', 'P2', 'P3', 'P4'] },
  team: { label: 'Team', field: 'team', fixedOptions: [
    { value: 'Money Movement', label: 'Money Movement' },
    { value: 'Payments Platform & Risk', label: 'Payments Platform' },
    { value: 'Cross Border', label: 'Cross Border' },
    { value: 'Payments Experience', label: 'Payments Experience' },
    { value: 'Shop Wallet', label: 'Shop Wallet' },
    { value: 'Billing', label: 'Billing' },
    { value: 'Taxes', label: 'Taxes' }
  ]},
  theme: { label: 'Theme', field: 'theme', dynamic: true },
  phase: { label: 'Phase', field: 'phase', dynamic: true },
  status: { label: 'Status', field: 'status', dynamic: true },
  editions: { label: 'Editions', field: 'editions', fixedOptions: ['S26', 'W27', 'No'] },
  partners: { label: 'Partner', field: 'partnerDependency', dynamic: true, excludeValues: ['no', ''] },
  partnerTeams: { label: 'Partner Teams', field: 'partnerTeams', dynamic: true },
  subTeam: { label: 'Sub Team', field: 'subTeam', dynamic: true }
};

function parseProjects(rows) {
  if (!rows || rows.length < 2) return [];
  const headers = rows[0];
  const colIndex = {};
  headers.forEach((h, i) => { colIndex[h.toLowerCase().trim()] = i; });

  return rows.slice(1).map((row, idx) => {
    const get = (key) => {
      const i = colIndex[key.toLowerCase()];
      return i !== undefined ? (row[i] || '').trim() : '';
    };

    const project = get('project (ensure vault project is linked)') || get('project');
    if (!project) return null;

    return {
      id: idx + 1,
      theme: get('pcb theme'),
      rank: parseInt(get('rank')) || 999,
      half: get('h'),
      priority: get('priority'),
      bigRock: get('pcb big rock'),
      name: project,
      description: get('description'),
      team: get('team'),
      subTeam: get('sub team') || get('subteam'),
      champion: get('champion'),
      startDate: get('start date') || get('starts'),
      shipping: get('shipping'),
      editions: get('editions'),
      needsUX: get('needs ux'),
      needsToS: get('need tos /merchant comms'),
      dependencies: get('dependencies'),
      partnerDependency: get('partner dependency'),
      partnerTeams: get('partner teams (internal)'),
      vaultStatus: get('vault status'),
      shipMonth: get('ship month'),
      phase: get('phase'),
      status: get('status') || 'Unknown',
    };
  }).filter(p => p !== null);
}

function getFiltered() {
  let ps = allProjects.slice();
  const q = filters.search.toLowerCase();
  if (q) ps = ps.filter(p => 
    p.name.toLowerCase().includes(q) || 
    (p.description || '').toLowerCase().includes(q) ||
    (p.champion || '').toLowerCase().includes(q) ||
    (p.bigRock || '').toLowerCase().includes(q) ||
    (p.team || '').toLowerCase().includes(q)
  );
  
  // H (H1/H2) filter (array)
  if (filters.half.length > 0) {
    ps = ps.filter(p => filters.half.includes(p.half));
  }

  // Priority filter (array)
  if (filters.priority.length > 0) {
    ps = ps.filter(p => filters.priority.includes(p.priority));
  }
  
  // Team filter (array with partial match)
  if (filters.team.length > 0) {
    ps = ps.filter(p => filters.team.some(t => (p.team || '').includes(t)));
  }
  
  // Theme filter (array)
  if (filters.theme.length > 0) {
    ps = ps.filter(p => filters.theme.includes(p.theme));
  }
  
  // Phase filter (array)
  if (filters.phase.length > 0) {
    ps = ps.filter(p => filters.phase.some(s => s.toLowerCase() === (p.phase || '').toLowerCase()));
  }

  // Status filter (array)
  if (filters.status.length > 0) {
    ps = ps.filter(p => filters.status.some(s => s.toLowerCase() === (p.status || '').toLowerCase()));
  }
  
  // Editions filter (array with special handling)
  if (filters.editions.length > 0) {
    ps = ps.filter(p => {
      const ed = (p.editions || '').toUpperCase();
      return filters.editions.some(f => {
        if (f === 'S26') return ed.includes('S26');
        if (f === 'W27') return ed.includes('W27');
        if (f === 'No') return ed === 'NO' || !p.editions;
        return false;
      });
    });
  }
  
  // Partners filter (array). Match individual partners exactly so that
  // selecting "Ant" doesn't also surface "Antom" projects.
  if (filters.partners.length > 0) {
    ps = ps.filter(p => {
      const projectPartners = (p.partnerDependency || '')
        .split(',')
        .map(v => v.trim().toLowerCase())
        .filter(Boolean);
      return filters.partners.some(fp => projectPartners.includes(fp.toLowerCase()));
    });
  }

  // Partner Teams (Internal) filter (array, comma-separated values)
  if (filters.partnerTeams.length > 0) {
    ps = ps.filter(p => {
      const tokens = (p.partnerTeams || '')
        .split(',')
        .map(v => v.trim().toLowerCase())
        .filter(Boolean);
      return filters.partnerTeams.some(ft => tokens.includes(ft.toLowerCase()));
    });
  }

  // Sub Team filter (array)
  if (filters.subTeam.length > 0) {
    ps = ps.filter(p => filters.subTeam.some(s => s.toLowerCase() === (p.subTeam || '').toLowerCase()));
  }

  // Hide Done items unless the user explicitly opts in
  if (!showDone) {
    ps = ps.filter(p => !isDoneProject(p));
  }

  // Flagged-only: keep projects with Priority / Target GA / End Date changes since Jul 2
  if (flaggedOnly) {
    ps = ps.filter(hasChangeFlag);
  }

  // Stopped work is surfaced in its own section below the table — never in the main list.
  ps = ps.filter(p => !isStoppedProject(p));

  ps.sort((a, b) => {
    let va, vb;
    if (sortCol === 'rank') { va = a.rank; vb = b.rank; return (va - vb) * sortDir; }
    if (sortCol === 'half') { va = a.half || ''; vb = b.half || ''; return va.localeCompare(vb) * sortDir; }
    if (sortCol === 'priority') {
      va = PRIORITY_ORDER[a.priority] ?? 99;
      vb = PRIORITY_ORDER[b.priority] ?? 99;
      return (va - vb) * sortDir;
    }
    if (sortCol === 'startDate') {
      // Sort by the effective Work Starts value (Ship Month fallback for non-Vault projects)
      const da = parseSortableDate(getWorkStarts(a));
      const db = parseSortableDate(getWorkStarts(b));
      return (da - db) * sortDir;
    }
    if (sortCol === 'shipping') {
      const da = parseSortableDate(a.shipping);
      const db = parseSortableDate(b.shipping);
      return (da - db) * sortDir;
    }
    if (sortCol === 'endDate') {
      const da = parseSortableDate(getEndDate(a));
      const db = parseSortableDate(getEndDate(b));
      return (da - db) * sortDir;
    }
    if (sortCol === 'name') { va = a.name; vb = b.name; }
    else if (sortCol === 'theme') { va = a.theme; vb = b.theme; }
    else if (sortCol === 'team') { va = a.team; vb = b.team; }
    else if (sortCol === 'subTeam') { va = a.subTeam; vb = b.subTeam; }
    else if (sortCol === 'champion') { va = a.champion; vb = b.champion; }
    else if (sortCol === 'partnerDependency') { va = a.partnerDependency; vb = b.partnerDependency; }
    else if (sortCol === 'status') { va = a.status; vb = b.status; }
    else if (sortCol === 'phase') { va = a.phase; vb = b.phase; }
    else { va = a.name; vb = b.name; }
    return (va || '').localeCompare(vb || '') * sortDir;
  });

  return ps;
}

function buildFilterOptions() {
  // Get dynamic values from data
  const dynamicValues = {
    theme: [...new Set(allProjects.map(p => p.theme).filter(Boolean))].sort(),
    phase: [...new Set(allProjects.map(p => p.phase).filter(Boolean))].sort(),
    status: [...new Set(allProjects.map(p => p.status).filter(Boolean))].sort(),
    partners: [...new Set(
      allProjects
        .flatMap(p => (p.partnerDependency || '').split(','))
        .map(v => v.trim())
        .filter(v => v && v.toLowerCase() !== 'no')
        // Exclude long free-text descriptions (not partner names)
        .filter(v => v.length <= 35 && !/[.!?]/.test(v))
    )].sort(),
    partnerTeams: [...new Set(
      allProjects
        .flatMap(p => (p.partnerTeams || '').split(','))
        .map(v => v.trim())
        .filter(v => v && v.length <= 35 && !/[.!?]/.test(v))
    )].sort(),
    subTeam: [...new Set(
      allProjects
        .map(p => (p.subTeam || '').trim())
        .filter(Boolean)
    )].sort()
  };

  // Build each multi-select dropdown
  document.querySelectorAll('.multi-select-dropdown[data-filter]').forEach(dropdown => {
    const filterKey = dropdown.dataset.filter;
    const config = FILTER_CONFIG[filterKey];
    if (!config) return;
    
    const panel = dropdown.querySelector('.multi-select-panel');
    if (!panel) return;
    
    let options = [];
    if (config.fixedOptions) {
      options = config.fixedOptions.map(opt => 
        typeof opt === 'object' ? opt : { value: opt, label: opt }
      );
    } else if (config.dynamic && dynamicValues[filterKey]) {
      options = dynamicValues[filterKey].map(v => ({ value: v, label: v.length > 35 ? v.substring(0, 35) + '…' : v }));
    }
    
    const selectedVals = filters[filterKey] || [];
    const allSelected = options.length > 0 && selectedVals.length === options.length;
    const someSelected = selectedVals.length > 0 && selectedVals.length < options.length;
    
    panel.innerHTML = `
      <label class="multi-select-option select-all ${someSelected ? 'partial' : ''} ${allSelected ? 'selected' : ''}">
        <input type="checkbox" value="__all__" ${allSelected ? 'checked' : ''} ${someSelected ? 'data-partial="true"' : ''}>Select All
      </label>
      ${options.map(opt => 
        `<label class="multi-select-option${selectedVals.includes(opt.value) ? ' selected' : ''}">
          <input type="checkbox" value="${opt.value}" ${selectedVals.includes(opt.value) ? 'checked' : ''}>${opt.label}
        </label>`
      ).join('')}
    `;
    
    updateTriggerText(dropdown, filterKey);
  });
}

function updateTriggerText(dropdown, filterKey) {
  const trigger = dropdown.querySelector('.multi-select-trigger');
  const config = FILTER_CONFIG[filterKey];
  if (!trigger || !config) return;
  
  const selected = filters[filterKey] || [];
  if (selected.length === 0) {
    trigger.innerHTML = `${config.label} <span class="dropdown-arrow">▾</span>`;
    trigger.classList.remove('active');
  } else if (selected.length === 1) {
    const label = config.fixedOptions 
      ? (config.fixedOptions.find(o => (typeof o === 'object' ? o.value : o) === selected[0])?.label || selected[0])
      : selected[0];
    const displayLabel = typeof label === 'string' && label.length > 12 ? label.substring(0, 12) + '…' : label;
    trigger.innerHTML = `${displayLabel} <span class="dropdown-arrow">▾</span>`;
    trigger.classList.add('active');
  } else {
    trigger.innerHTML = `${selected.length} ${config.label.toLowerCase()} <span class="dropdown-arrow">▾</span>`;
    trigger.classList.add('active');
  }
}

function getPriorityClass(p) {
  const prio = (p || '').toUpperCase();
  if (prio === 'P0') return 'priority-p0';
  if (prio === 'P1') return 'priority-p1';
  if (prio === 'P2') return 'priority-p2';
  if (prio === 'P3') return 'priority-p3';
  if (prio === 'P4') return 'priority-p4';
  return '';
}

function getStatusClass(s) {
  const status = (s || '').toLowerCase();
  if (status.includes('progress')) return 'status-in-progress';
  if (status.includes('complete') || status.includes('shipped')) return 'status-complete';
  if (status.includes('stopped') || status.includes('blocked')) return 'status-stopped';
  if (status.includes('backlog')) return 'status-backlog';
  if (status.includes('paused')) return 'status-paused';
  return '';
}

function getPhaseClass(p) {
  const ph = (p || '').toLowerCase().replace(/_/g, '-');
  if (ph === 'done' || ph === 'completed' || ph === 'complete') return 'status-complete';
  if (ph === 'build' || ph === 'in-progress' || ph === 'release' || ph === 'observe') return 'status-in-progress';
  if (ph === 'stopped' || ph === 'blocked') return 'status-stopped';
  if (ph === 'backlog' || ph === 'planned') return 'status-backlog';
  if (ph === 'paused') return 'status-paused';
  return '';
}

function getEditionsBadge(e) {
  const ed = (e || '').trim().toUpperCase();
  if (ed.includes('S26')) return '<span class="editions-badge editions-s26">S26</span>';
  if (ed.includes('W27')) return '<span class="editions-badge editions-w27">W27</span>';
  if (ed === 'NO' || !ed) return '<span class="editions-badge editions-no">—</span>';
  return `<span class="editions-badge editions-no">${e}</span>`;
}

function getThemePill(theme) {
  if (!theme) return '<span class="muted-cell">—</span>';
  const colors = THEME_COLORS[theme] || { bg: '#f1f5f9', color: '#475569' };
  return `<span class="theme-pill" style="background:${colors.bg};color:${colors.color}" title="${theme}">${theme}</span>`;
}

function getVaultUrl(projectName) {
  if (!projectName || !vaultUrls) return null;
  // Direct match
  if (vaultUrls[projectName]) return vaultUrls[projectName];
  // Try case-insensitive match
  const lowerName = projectName.toLowerCase();
  for (const [key, url] of Object.entries(vaultUrls)) {
    if (key.toLowerCase() === lowerName) return url;
  }
  // Try partial match (project name contains key or key contains project name)
  for (const [key, url] of Object.entries(vaultUrls)) {
    if (lowerName.includes(key.toLowerCase()) || key.toLowerCase().includes(lowerName)) {
      return url;
    }
  }
  return null;
}

function render() {
  const wrap = document.getElementById('table-wrap');
  const ps = getFiltered();
  const doneCount = allProjects.filter(isDoneProject).length;
  const stoppedCount = allProjects.filter(isStoppedProject).length;
  const rcEl = document.getElementById('row-count');
  const hints = [];
  if (!showDone && doneCount > 0) hints.push(`${doneCount} Done hidden`);
  if (stoppedCount > 0) hints.push(`${stoppedCount} Stopped in section below`);
  if (flaggedOnly) hints.push(`${Object.keys(changeMap).length} flagged since Jul 2`);
  const hint = hints.length ? ` <span style="color:var(--text-muted);font-style:italic;">· ${hints.join(' · ')}</span>` : '';
  rcEl.innerHTML = `${ps.length} of ${allProjects.length}${hint}`;

  if (!ps.length) {
    wrap.innerHTML = '<div class="empty-state">No projects match the current filters.</div>';
    renderStoppedSection();
    return;
  }

  const colDef = [
    { key: 'priority', label: 'Priority', sort: true },
    { key: 'name', label: 'Project', sort: true },
    { key: 'phase', label: 'Phase', sort: true },
    { key: 'status', label: 'Status', sort: true },
    { key: 'team', label: 'Team', sort: true },
    { key: 'startDate', label: 'Work Starts', sort: true },
    { key: 'shipping', label: 'Target GA', sort: true },
    { key: 'endDate', label: 'End Date', sort: true },
    { key: 'editions', label: 'Editions', sort: false },
    { key: 'subTeam', label: 'Sub Team', sort: true },
    { key: 'champion', label: 'Champion', sort: true },
    { key: 'partnerDependency', label: 'Partner', sort: true },
  ];

  const thead = `<thead><tr>${colDef.map(c =>
    `<th ${c.sort ? `data-col="${c.key}"` : 'class="nosort"'} ${sortCol === c.key ? ' class="sorted"' : ''}>
      ${c.label}${c.sort ? `<span class="sort-arrow">${sortCol === c.key ? (sortDir === 1 ? '▲' : '▼') : '▲'}</span>` : ''}
    </th>`
  ).join('')}</tr></thead>`;

  const rows = ps.map(p => {
    const prioClass = getPriorityClass(p.priority);
    const statusClass = getStatusClass(p.status);
    const phaseClass = getPhaseClass(p.phase);
    const partnerList = (p.partnerDependency || '')
      .split(',')
      .map(v => v.trim())
      .filter(v => v && v.toLowerCase() !== 'no');
    const hasPartner = partnerList.length > 0;
    const partnerBadgesHtml = partnerList
      .map(v => `<span class="partner-badge">${v}</span>`)
      .join(' ');
    const vaultUrl = getVaultUrl(p.name);
    const projectNameHtml = vaultUrl 
      ? `<a href="${vaultUrl}" target="_blank" class="proj-link" title="${p.name}">${p.name} <i class="fas fa-external-link-alt vault-icon"></i></a>`
      : `<span title="${p.name}">${p.name}</span> <span class="not-on-vault">(not on vault)</span>`;
    
    // Work Starts: if there's no Vault project linked, fall back to Ship Month
    const workStarts = getWorkStarts(p);
    const endDate = getEndDate(p);
    const priorityInner = p.priority
      ? `<span class="priority-badge ${prioClass}">${p.priority}</span>`
      : '<span class="muted-cell">—</span>';
    const targetGaInner = `<span class="muted-cell">${p.shipping || '—'}</span>`;
    const endDateInner = `<span class="muted-cell">${endDate || '—'}</span>`;
    return `<tr>
      <td>${flaggedCell(priorityInner, p, 'priority', 'Priority')}</td>
      <td class="col-name">
        <div class="proj-name-cell">${projectNameHtml}</div>
        ${p.bigRock && p.bigRock !== 'N/A' ? `<div style="font-size:10px;color:var(--text-muted);margin-top:2px;">${p.bigRock}</div>` : ''}
      </td>
      <td>${p.phase ? `<span class="status-badge ${phaseClass}">${p.phase.replace(/_/g,' ')}</span>` : '<span class="muted-cell">—</span>'}</td>
      <td>${p.status && p.status !== 'Unknown' ? `<span class="status-badge ${statusClass}">${p.status}</span>` : '<span class="muted-cell">—</span>'}</td>
      <td><span class="team-badge">${p.team || '—'}</span></td>
      <td class="muted-cell">${workStarts || '—'}</td>
      <td>${flaggedCell(targetGaInner, p, 'targetGa', 'Target GA')}</td>
      <td>${flaggedCell(endDateInner, p, 'endDate', 'End Date')}</td>
      <td>${getEditionsBadge(p.editions)}</td>
      <td class="muted-cell">${p.subTeam || '—'}</td>
      <td class="muted-cell">${p.champion || '—'}</td>
      <td>${hasPartner ? partnerBadgesHtml : '<span class="muted-cell">—</span>'}</td>
    </tr>`;
  }).join('');

  wrap.innerHTML = `<table>${thead}<tbody>${rows}</tbody></table>`;

  wrap.querySelectorAll('th[data-col]').forEach(th => {
    th.addEventListener('click', () => {
      const col = th.dataset.col;
      if (sortCol === col) sortDir *= -1;
      else { sortCol = col; sortDir = 1; }
      render();
    });
  });

  bindChangeFlagTooltips(wrap);

  renderStoppedSection();
}

function renderStoppedSection() {
  const el = document.getElementById('stopped-section');
  if (!el) return;
  const stopped = allProjects
    .filter(isStoppedProject)
    .sort((a, b) => {
      const pa = PRIORITY_ORDER[a.priority] ?? 99;
      const pb = PRIORITY_ORDER[b.priority] ?? 99;
      if (pa !== pb) return pa - pb;
      return (a.name || '').localeCompare(b.name || '');
    });
  if (!stopped.length) { el.innerHTML = ''; return; }
  const rows = stopped.map(p => {
    const prioClass = getPriorityClass(p.priority);
    const phase = p.phase || p.status || 'Stopped';
    const vaultUrl = getVaultUrl(p.name);
    const nameHtml = vaultUrl
      ? `<a href="${vaultUrl}" target="_blank" class="proj-link" title="${p.name}">${p.name} <i class="fas fa-external-link-alt vault-icon"></i></a>`
      : `<span title="${p.name}">${p.name}</span>`;
    return `<tr style="opacity:0.75;">
      <td>${p.priority ? `<span class="priority-badge ${prioClass}">${p.priority}</span>` : '<span class="muted-cell">—</span>'}</td>
      <td class="col-name">${nameHtml}</td>
      <td><span class="status-badge status-stopped">${phase.replace(/_/g,' ')}</span></td>
      <td><span class="team-badge">${p.team || '—'}</span></td>
      <td class="muted-cell">${p.subTeam || '—'}</td>
      <td class="muted-cell">${p.champion || '—'}</td>
    </tr>`;
  }).join('');
  el.innerHTML = `
    <details style="margin-top:24px;background:var(--bg-card);border:1px solid var(--border);border-radius:8px;">
      <summary style="cursor:pointer;padding:12px 16px;font-weight:600;font-size:13px;color:var(--text-primary);list-style:none;display:flex;align-items:center;gap:8px;">
        <i class="fas fa-ban" style="color:#ef4444;font-size:12px;"></i>
        Stopped Work
        <span style="font-size:11px;color:var(--text-muted);font-weight:500;">${stopped.length} project${stopped.length !== 1 ? 's' : ''}</span>
        <i class="fas fa-chevron-down" style="margin-left:auto;font-size:10px;color:var(--text-muted);"></i>
      </summary>
      <div style="padding:0 16px 16px;">
        <table style="width:100%;">
          <thead><tr><th>Priority</th><th>Project</th><th>Phase</th><th>Team</th><th>Sub Team</th><th>Champion</th></tr></thead>
          <tbody>${rows}</tbody>
        </table>
      </div>
    </details>
  `;
}

// Multi-select dropdown setup
let dropdownsInitialized = false;
function setupMultiSelectDropdowns() {
  if (dropdownsInitialized) return;
  dropdownsInitialized = true;
  
  // Handle clicks on dropdowns
  document.querySelectorAll('.multi-select-dropdown[data-filter]').forEach(dropdown => {
    const filterKey = dropdown.dataset.filter;
    
    dropdown.addEventListener('click', (e) => {
      const trigger = e.target.closest('.multi-select-trigger');
      if (trigger) {
        e.stopPropagation();
        // Close other dropdowns
        document.querySelectorAll('.multi-select-panel.open').forEach(p => {
          if (p !== dropdown.querySelector('.multi-select-panel')) p.classList.remove('open');
        });
        dropdown.querySelector('.multi-select-panel')?.classList.toggle('open');
        return;
      }
      
      // Handle checkbox changes
      const checkbox = e.target.closest('input[type="checkbox"]');
      if (checkbox) {
        const val = checkbox.value;
        const panel = dropdown.querySelector('.multi-select-panel');
        const allCheckboxes = panel.querySelectorAll('input[type="checkbox"]:not([value="__all__"])');
        const selectAllCheckbox = panel.querySelector('input[value="__all__"]');
        
        if (val === '__all__') {
          // Select All clicked
          const shouldSelect = checkbox.checked;
          allCheckboxes.forEach(cb => {
            cb.checked = shouldSelect;
            cb.closest('.multi-select-option').classList.toggle('selected', shouldSelect);
          });
          filters[filterKey] = shouldSelect ? Array.from(allCheckboxes).map(cb => cb.value) : [];
          checkbox.closest('.multi-select-option').classList.toggle('selected', shouldSelect);
          checkbox.closest('.multi-select-option').classList.remove('partial');
        } else {
          // Individual item clicked
          if (checkbox.checked) {
            if (!filters[filterKey].includes(val)) filters[filterKey].push(val);
          } else {
            filters[filterKey] = filters[filterKey].filter(v => v !== val);
          }
          checkbox.closest('.multi-select-option').classList.toggle('selected', checkbox.checked);
          
          // Update Select All state
          const allChecked = Array.from(allCheckboxes).every(cb => cb.checked);
          const someChecked = Array.from(allCheckboxes).some(cb => cb.checked);
          if (selectAllCheckbox) {
            selectAllCheckbox.checked = allChecked;
            const selectAllOption = selectAllCheckbox.closest('.multi-select-option');
            selectAllOption.classList.toggle('selected', allChecked);
            selectAllOption.classList.toggle('partial', someChecked && !allChecked);
          }
        }
        
        updateTriggerText(dropdown, filterKey);
        render();
      }
    });
  });
  
  // Close dropdowns when clicking outside
  document.addEventListener('click', (e) => {
    if (!e.target.closest('.multi-select-dropdown')) {
      document.querySelectorAll('.multi-select-panel.open').forEach(p => p.classList.remove('open'));
    }
  });
}

document.getElementById('clear-btn').addEventListener('click', () => {
  filters = { search: '', half: [], priority: [], team: [], theme: [], phase: [], status: [], editions: [], partners: [], partnerTeams: [], subTeam: [] };
  document.getElementById('search-input').value = '';
  showDone = false;
  const showDoneToggle = document.getElementById('show-done-toggle');
  if (showDoneToggle) showDoneToggle.checked = false;
  flaggedOnly = false;
  const flaggedOnlyToggle = document.getElementById('flagged-only-toggle');
  if (flaggedOnlyToggle) flaggedOnlyToggle.checked = false;
  
  // Reset all multi-select dropdowns
  document.querySelectorAll('.multi-select-dropdown[data-filter]').forEach(dropdown => {
    const filterKey = dropdown.dataset.filter;
    dropdown.querySelectorAll('input[type="checkbox"]').forEach(cb => {
      cb.checked = false;
      cb.closest('.multi-select-option').classList.remove('selected', 'partial');
    });
    updateTriggerText(dropdown, filterKey);
  });
  
  render();
});

// Refresh button
document.getElementById('refresh-btn').addEventListener('click', loadData);

// Load data from embedded JSON (populated at build time)
async function loadData() {
  const wrap = document.getElementById('table-wrap');
  wrap.innerHTML = '<div class="empty-state"><span class="loading-spinner"></span> Loading data…</div>';
  
  try {
    const [response, changeResp] = await Promise.all([
      fetch('data/projects.json'),
      fetch('data/changed-since-2026-07-02.json').catch(() => null),
    ]);
    if (!response.ok) throw new Error('Failed to load data');
    const data = await response.json();
    vaultUrls = data.vaultUrls || {};
    allProjects = parseProjects(data.rows);
    changeMap = {};
    if (changeResp && changeResp.ok) {
      const changeData = await changeResp.json();
      changeMap = changeData.changes || {};
    }
    buildFilterOptions();
    setupMultiSelectDropdowns();
    
    // Check for URL search parameter
    const urlParams = new URLSearchParams(window.location.search);
    const searchParam = urlParams.get('search');
    if (searchParam) {
      filters.search = searchParam;
      const searchInput = document.getElementById('search-input');
      if (searchInput) searchInput.value = searchParam;
    }
    
    render();
  } catch (e) {
    wrap.innerHTML = `<div class="empty-state">Failed to load data: ${e.message}<br><br>
      <small>Make sure data/projects.json exists and contains the spreadsheet data.</small></div>`;
    console.error(e);
  }
}

// Dark mode toggle
(function() {
  const toggle = document.getElementById('darkModeToggle');
  const sidebarToggle = document.getElementById('sidebarToggle');
  const sidebar = document.getElementById('sidebar');

  function updateDarkIcon() {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    const icon = toggle ? toggle.querySelector('i') : null;
    if (icon) icon.className = isDark ? 'fas fa-sun' : 'fas fa-moon';
  }

  if (toggle) {
    toggle.addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('pcb-theme', next);
      updateDarkIcon();
    });
    
    const saved = localStorage.getItem('pcb-theme');
    const sys = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', saved || sys);
    updateDarkIcon();
  }

  if (sidebarToggle && sidebar) {
    const saved = localStorage.getItem('pcb-sidebar-collapsed');
    if (saved === '1') sidebar.classList.add('collapsed');

    sidebarToggle.addEventListener('click', () => {
      sidebar.classList.toggle('collapsed');
      localStorage.setItem('pcb-sidebar-collapsed', sidebar.classList.contains('collapsed') ? '1' : '0');
    });
  }
})();

// Initialize
document.addEventListener('DOMContentLoaded', loadData);
