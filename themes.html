<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<title>By Theme — PCB Roadmap</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-primary:  #f6f6f7;
    --bg-card:     #ffffff;
    --bg-input:    #f3f3f6;
    --bg-sidebar:  #1a1a1f;
    --border:      rgba(0,0,0,0.08);
    --border-hover: rgba(0,0,0,0.14);
    --text-primary: #1a1a1f;
    --text-secondary: #6b6b76;
    --text-muted:  #9a9aa4;
    --accent-green: #7c3aed;
    --accent-green-dim: rgba(124,58,237,0.08);
    --radius:      12px;
    --font-sans:   'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --sidebar-width: 200px;
    --sidebar-collapsed: 56px;
    --shadow-lg:   0 8px 30px rgba(0,0,0,0.08);
  }

  [data-theme="dark"] {
    --bg-primary:  #101114;
    --bg-card:     #202227;
    --bg-input:    #292C32;
    --bg-sidebar:  #050506;
    --border:      rgba(252,252,253,0.08);
    --border-hover: rgba(252,252,253,0.15);
    --text-primary: #FCFCFD;
    --text-secondary: #9DA1AE;
    --text-muted:  #676D7E;
    --shadow-lg:   0 8px 30px rgba(0,0,0,0.5);
  }

  body { background: var(--bg-primary); color: var(--text-primary); font-family: var(--font-sans); font-size: 13px; height: 100vh; display: flex; flex-direction: row; overflow: hidden; }

  header {
    background: var(--bg-card);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 20px;
    flex-shrink: 0;
    gap: 16px;
    height: 56px;
  }
  .header-left { display: flex; align-items: center; gap: 16px; }
  .header-right { display: flex; align-items: center; gap: 12px; }

  #refresh-btn {
    padding: 5px 12px;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg-input);
    color: var(--text-secondary);
    font-size: 12px;
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 6px;
    transition: all .15s;
  }
  #refresh-btn:hover { border-color: var(--border-hover); color: var(--text-primary); }

  .app-layout { display: flex; height: 100vh; overflow: hidden; width: 100%; }
  .sidebar {
    width: var(--sidebar-width);
    background: var(--bg-sidebar);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    transition: width 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    overflow: hidden;
    z-index: 100;
    border-right: 1px solid rgba(255,255,255,0.05);
  }
  .sidebar.collapsed { width: var(--sidebar-collapsed); }
  .sidebar-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 14px;
    border-bottom: 1px solid rgba(255,255,255,0.06);
    min-height: 56px;
  }
  .sidebar-brand {
    display: flex;
    align-items: center;
    gap: 10px;
    overflow: hidden;
    white-space: nowrap;
  }
  .sidebar-logo { font-size: 18px; flex-shrink: 0; width: 28px; text-align: center; }
  .sidebar-title { font-size: 13px; font-weight: 700; color: #fff; letter-spacing: -0.01em; transition: opacity 0.2s; white-space: nowrap; }
  .sidebar.collapsed .sidebar-title { opacity: 0; width: 0; }
  .sidebar-toggle {
    background: none; border: none; color: rgba(255,255,255,0.4);
    cursor: pointer; padding: 6px; border-radius: 6px;
    transition: all 0.15s; flex-shrink: 0; font-size: 11px;
  }
  .sidebar-toggle:hover { background: rgba(255,255,255,0.08); color: rgba(255,255,255,0.8); }
  .sidebar.collapsed .sidebar-header { justify-content: center; padding: 16px 0; }
  .sidebar.collapsed .sidebar-brand { display: none; }
  .sidebar-nav {
    padding: 10px 8px;
    display: flex; flex-direction: column; gap: 2px;
  }
  .sidebar-spacer { flex: 1; }
  .sidebar-bottom {
    padding: 8px 8px 16px;
    display: flex; flex-direction: column; gap: 2px;
    border-top: 1px solid rgba(255,255,255,0.06);
  }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 12px; border-radius: 8px; cursor: pointer;
    color: rgba(255,255,255,0.5); transition: all 0.15s;
    white-space: nowrap; overflow: hidden;
    font-size: 13px; font-weight: 500;
    text-decoration: none; position: relative;
  }
  .nav-item::before {
    content: ''; position: absolute; left: 0; top: 50%;
    transform: translateY(-50%); width: 3px; height: 0;
    border-radius: 0 2px 2px 0; background: var(--accent-green);
    transition: height 0.2s;
  }
  .nav-item:hover { background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.85); }
  .nav-item:hover::before { height: 14px; }
  .nav-item.active { background: rgba(124,58,237,0.15); color: var(--accent-green); font-weight: 600; }
  .nav-item.active::before { height: 20px; }
  .nav-item i { width: 16px; text-align: center; flex-shrink: 0; font-size: 13px; }
  .nav-label { transition: opacity 0.2s; }
  .sidebar.collapsed .nav-label { opacity: 0; width: 0; }
  .sidebar.collapsed .nav-item { justify-content: center; padding: 9px; gap: 0; }
  .sidebar.collapsed .sidebar-nav,
  .sidebar.collapsed .sidebar-bottom { padding-left: 0; padding-right: 0; align-items: center; }

  .main-content {
    flex: 1; min-width: 0;
    display: flex; flex-direction: column;
    overflow: hidden;
    background: var(--bg-primary);
  }

  .content-wrap {
    flex: 1;
    overflow: auto;
    padding: 24px;
  }

  .theme-group {
    margin-bottom: 32px;
  }

  .theme-header {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
    padding-bottom: 12px;
    border-bottom: 2px solid var(--border);
  }

  .theme-icon {
    width: 36px;
    height: 36px;
    border-radius: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
  }

  .theme-title {
    font-size: 16px;
    font-weight: 700;
    color: var(--text-primary);
  }

  .theme-count {
    font-size: 12px;
    color: var(--text-muted);
    background: var(--bg-input);
    padding: 2px 8px;
    border-radius: 10px;
  }

  .project-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    margin-bottom: 10px;
    display: flex;
    align-items: flex-start;
    gap: 16px;
    transition: all 0.15s;
  }
  .project-card:hover {
    border-color: var(--border-hover);
    box-shadow: 0 2px 8px rgba(0,0,0,0.04);
  }

  .project-priority {
    flex-shrink: 0;
  }

  .priority-badge {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 600;
    white-space: nowrap;
  }
  .priority-p0 { background: #fee2e2; color: #b91c1c; }
  .priority-p1 { background: #fef3c7; color: #b45309; }
  .priority-p2 { background: #dbeafe; color: #1d4ed8; }
  .priority-p3 { background: #dcfce7; color: #15803d; }
  .priority-p4 { background: #f1f5f9; color: #475569; }

  .project-info {
    flex: 1;
    min-width: 0;
  }

  .project-name a { color: var(--accent); text-decoration: none; }
  .project-name a:hover { text-decoration: underline; }
  .project-name {
    font-size: 14px;
    font-weight: 600;
    color: var(--text-primary);
    margin-bottom: 4px;
  }

  .project-desc {
    font-size: 12px;
    color: var(--text-secondary);
    line-height: 1.5;
    margin-bottom: 8px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }

  .project-meta {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    font-size: 11px;
    color: var(--text-muted);
  }

  .meta-item {
    display: flex;
    align-items: center;
    gap: 4px;
  }

  .meta-item i {
    font-size: 10px;
    opacity: 0.7;
  }

  .status-badge {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 10px;
    font-weight: 500;
  }
  .status-in-progress { background: #dbeafe; color: #1d4ed8; }
  .status-complete { background: #dcfce7; color: #15803d; }
  .status-shipped { background: #dcfce7; color: #15803d; }
  .status-stopped { background: #fee2e2; color: #b91c1c; }
  .status-backlog { background: #f1f5f9; color: #475569; }
  .status-paused { background: #fef3c7; color: #b45309; }

  .editions-badge {
    display: inline-block;
    padding: 2px 6px;
    border-radius: 6px;
    font-size: 10px;
    font-weight: 600;
  }
  .editions-s26 { background: #8b5cf6; color: #fff; }
  .editions-w27 { background: #0891b2; color: #fff; }

  .empty-state { padding: 60px; text-align: center; color: var(--text-muted); }

  .loading-spinner {
    display: inline-block;
    width: 14px;
    height: 14px;
    border: 2px solid var(--border);
    border-top-color: var(--accent-green);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  .source-link {
    font-size: 11px;
    color: var(--text-muted);
    text-decoration: none;
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .source-link:hover { color: var(--accent-green); }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<div class="app-layout">

<nav class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-brand">
      <span class="sidebar-logo">💳</span>
      <span class="sidebar-title">PCB Roadmap</span>
    </div>
    <button class="sidebar-toggle" id="sidebarToggle" title="Collapse"><i class="fas fa-chevron-left"></i></button>
  </div>
  <div class="sidebar-nav">
    <a href="index.html" class="nav-item">
      <i class="fas fa-table-cells"></i>
      <span class="nav-label">All Projects</span>
    </a>
    <a href="timeline.html" class="nav-item">
      <i class="fas fa-chart-gantt"></i>
      <span class="nav-label">Timeline</span>
    </a>
    <a href="themes.html" class="nav-item active">
      <i class="fas fa-layer-group"></i>
      <span class="nav-label">By Theme</span>
    </a>
    <a href="slip.html" class="nav-item">
      <i class="fas fa-clock-rotate-left"></i>
      <span class="nav-label">Slip</span>
    </a>
  </div>
  <div class="sidebar-spacer"></div>
  <div class="sidebar-bottom">
    <a href="https://docs.google.com/spreadsheets/d/17xd1aWdtf33kUk3giF5WyC4dJpbClOjPGh2cVMYiuvI" target="_blank" class="source-link" style="padding: 9px 12px;">
      <i class="fas fa-external-link-alt"></i>
      <span class="nav-label">Source Sheet</span>
    </a>
    <div class="nav-item" id="darkModeToggle">
      <i class="fas fa-moon"></i>
      <span class="nav-label">Dark Mode</span>
    </div>
  </div>
</nav>

<div class="main-content">
<header>
  <div class="header-left">
    <span style="font-weight: 600; font-size: 15px;">📊 Projects by Theme</span>
  </div>
  <div class="header-right">
    <button id="refresh-btn"><i class="fas fa-sync-alt"></i> Refresh</button>
  </div>
</header>

<div class="content-wrap" id="content">
  <div class="empty-state"><span class="loading-spinner"></span> Loading data…</div>
</div>
</div>

</div>

<script>
const THEME_CONFIG = {
  '~100% Shopify Payments': { bg: '#dbeafe', color: '#1d4ed8', icon: '💳' },
  'Defend merchants and Shopify from bad actors': { bg: '#fee2e2', color: '#b91c1c', icon: '🛡️' },
  'Set a new standard for baseline quality': { bg: '#dcfce7', color: '#15803d', icon: '✨' },
  'Gain sovereignty over our payments systems': { bg: '#fef3c7', color: '#b45309', icon: '🏛️' },
  'Make Shop Pay the dominant buyer wallet for commerce': { bg: '#f3e8ff', color: '#7c3aed', icon: '👛' },
  'Enable merchants to sell to buyers anywhere in the world': { bg: '#cffafe', color: '#0891b2', icon: '🌍' },
  'Shopify Payments Always On': { bg: '#fce7f3', color: '#be185d', icon: '⚡' },
  'Eng and Infra Excellence': { bg: '#e0e7ff', color: '#4338ca', icon: '⚙️' },
};

const PRIORITY_ORDER = { P0: 0, P1: 1, P2: 2, P3: 3, P4: 4 };

let allProjects = [];

function parseProjects(rows, vaultUrls) {
  if (!rows || rows.length < 2) return [];
  const headers = rows[0];
  const colIndex = {};
  headers.forEach((h, i) => { colIndex[h.toLowerCase().trim()] = i; });
  vaultUrls = vaultUrls || {};

  return rows.slice(1).map((row, idx) => {
    const get = (key) => {
      const i = colIndex[key.toLowerCase()];
      return i !== undefined ? (row[i] || '').trim() : '';
    };

    const project = get('project (ensure vault project is linked)') || get('project');
    if (!project) return null;

    return {
      id: idx + 1,
      theme: get('pcb theme'),
      priority: get('priority'),
      name: project,
      vaultUrl: vaultUrls[project] || '',
      description: get('description'),
      team: get('sub team') || get('subteam'),
      champion: get('champion'),
      shipping: get('shipping'),
      status: get('status') || 'Unknown',
      editions: get('editions'),
    };
  }).filter(p => p !== null && p.theme);
}

function getPriorityClass(p) {
  const prio = (p || '').toUpperCase();
  if (prio === 'P0') return 'priority-p0';
  if (prio === 'P1') return 'priority-p1';
  if (prio === 'P2') return 'priority-p2';
  if (prio === 'P3') return 'priority-p3';
  if (prio === 'P4') return 'priority-p4';
  return '';
}

function getStatusClass(s) {
  const status = (s || '').toLowerCase();
  if (status.includes('progress')) return 'status-in-progress';
  if (status.includes('complete') || status.includes('shipped')) return 'status-complete';
  if (status.includes('stopped') || status.includes('blocked')) return 'status-stopped';
  if (status.includes('backlog')) return 'status-backlog';
  if (status.includes('paused')) return 'status-paused';
  return '';
}

function getEditionsBadge(e) {
  const ed = (e || '').trim().toUpperCase();
  if (ed.includes('S26')) return '<span class="editions-badge editions-s26">S26</span>';
  if (ed.includes('W27')) return '<span class="editions-badge editions-w27">W27</span>';
  return '';
}

function render() {
  const content = document.getElementById('content');
  
  // Group projects by theme
  const grouped = {};
  allProjects.forEach(p => {
    if (!grouped[p.theme]) grouped[p.theme] = [];
    grouped[p.theme].push(p);
  });

  // Sort themes by project count
  const themes = Object.keys(grouped).sort((a, b) => grouped[b].length - grouped[a].length);

  if (!themes.length) {
    content.innerHTML = '<div class="empty-state">No projects found.</div>';
    return;
  }

  let html = '';

  themes.forEach(theme => {
    const projects = grouped[theme].sort((a, b) => {
      const pa = PRIORITY_ORDER[a.priority] ?? 99;
      const pb = PRIORITY_ORDER[b.priority] ?? 99;
      return pa - pb;
    });
    
    const config = THEME_CONFIG[theme] || { bg: '#f1f5f9', color: '#475569', icon: '📦' };

    html += `<div class="theme-group">
      <div class="theme-header">
        <div class="theme-icon" style="background:${config.bg};color:${config.color}">${config.icon}</div>
        <div class="theme-title">${theme}</div>
        <div class="theme-count">${projects.length} projects</div>
      </div>
      <div class="theme-projects">`;

    projects.forEach(p => {
      const prioClass = getPriorityClass(p.priority);
      const statusClass = getStatusClass(p.status);
      const edBadge = getEditionsBadge(p.editions);

      html += `<div class="project-card">
        <div class="project-priority">
          ${p.priority ? `<span class="priority-badge ${prioClass}">${p.priority}</span>` : ''}
        </div>
        <div class="project-info">
          <div class="project-name">${p.vaultUrl ? `<a href="${p.vaultUrl}" target="_blank" rel="noopener">${p.name}</a>` : p.name}</div>
          ${p.description ? `<div class="project-desc">${p.description}</div>` : ''}
          <div class="project-meta">
            ${p.champion ? `<div class="meta-item"><i class="fas fa-user"></i> ${p.champion}</div>` : ''}
            ${p.team ? `<div class="meta-item"><i class="fas fa-users"></i> ${p.team}</div>` : ''}
            ${p.shipping ? `<div class="meta-item"><i class="fas fa-calendar"></i> ${p.shipping}</div>` : ''}
            ${p.status && p.status !== 'Unknown' ? `<span class="status-badge ${statusClass}">${p.status}</span>` : ''}
            ${edBadge}
          </div>
        </div>
      </div>`;
    });

    html += `</div></div>`;
  });

  content.innerHTML = html;
}

async function loadData() {
  const content = document.getElementById('content');
  content.innerHTML = '<div class="empty-state"><span class="loading-spinner"></span> Loading data…</div>';
  
  try {
    const response = await fetch('data/projects.json');
    if (!response.ok) throw new Error('Failed to load data');
    const data = await response.json();
    allProjects = parseProjects(data.rows, data.vaultUrls || {});
    render();
  } catch (e) {
    content.innerHTML = `<div class="empty-state">Failed to load data: ${e.message}</div>`;
    console.error(e);
  }
}

document.getElementById('refresh-btn').addEventListener('click', loadData);

(function() {
  const toggle = document.getElementById('darkModeToggle');
  const sidebarToggle = document.getElementById('sidebarToggle');
  const sidebar = document.getElementById('sidebar');

  function updateDarkIcon() {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    const icon = toggle ? toggle.querySelector('i') : null;
    if (icon) icon.className = isDark ? 'fas fa-sun' : 'fas fa-moon';
  }

  if (toggle) {
    toggle.addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('pcb-theme', next);
      updateDarkIcon();
    });
    
    const saved = localStorage.getItem('pcb-theme');
    const sys = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', saved || sys);
    updateDarkIcon();
  }

  if (sidebarToggle && sidebar) {
    const saved = localStorage.getItem('pcb-sidebar-collapsed');
    if (saved === '1') sidebar.classList.add('collapsed');

    sidebarToggle.addEventListener('click', () => {
      sidebar.classList.toggle('collapsed');
      localStorage.setItem('pcb-sidebar-collapsed', sidebar.classList.contains('collapsed') ? '1' : '0');
    });
  }
})();

document.addEventListener('DOMContentLoaded', loadData);
</script>
</body>
</html>
