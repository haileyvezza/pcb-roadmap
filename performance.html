<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<script>(function(){var s=localStorage.getItem('pcb-theme'),d=window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.setAttribute('data-theme',s||d);})();</script>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" rel="stylesheet">
<title>Performance to Plan — PCB Roadmap</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-primary:  #f6f6f7;
    --bg-card:     #ffffff;
    --bg-input:    #f3f3f6;
    --bg-sidebar:  #ffffff;
    --border:      rgba(0,0,0,0.08);
    --border-hover: rgba(0,0,0,0.14);
    --text-primary: #1a1a1f;
    --text-secondary: #6b6b76;
    --text-muted:  #9a9aa4;
    --accent:      #0088FF;
    --radius:      12px;
    --font-sans:   'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    --sidebar-width: 200px;
    --sidebar-collapsed: 56px;
    --shadow-card: 0 1px 3px rgba(0,0,0,0.06);
    --shadow-lg:   0 8px 30px rgba(0,0,0,0.08);
    --phase-planned: #94a3b8;
    --phase-off-vault: #d1d5db;
    --phase-prototype: #a855f7;
    --phase-build: #f59e0b;
    --phase-observe: #06b6d4;
    --phase-release: #3b82f6;
    --phase-done: #94a3b8;
  }

  [data-theme="dark"] {
    --bg-primary:  #101114;
    --bg-card:     #202227;
    --bg-input:    #292C32;
    --bg-sidebar:  #1a1a1f;
    --border:      rgba(252,252,253,0.08);
    --border-hover: rgba(252,252,253,0.15);
    --text-primary: #FCFCFD;
    --text-secondary: #9DA1AE;
    --text-muted:  #676D7E;
    --shadow-card: 0 1px 4px rgba(0,0,0,0.4);
    --shadow-lg:   0 8px 30px rgba(0,0,0,0.5);
  }

  body { background: var(--bg-primary); color: var(--text-primary); font-family: var(--font-sans); font-size: 13px; height: 100vh; display: flex; flex-direction: row; overflow: hidden; }

  .app-layout { display: flex; height: 100vh; overflow: hidden; width: 100%; }
  .sidebar {
    width: var(--sidebar-width);
    background: var(--bg-sidebar);
    display: flex;
    flex-direction: column;
    flex-shrink: 0;
    transition: width 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    overflow: hidden;
    z-index: 100;
    border-right: 1px solid var(--border);
  }
  .sidebar.collapsed { width: var(--sidebar-collapsed); }
  .sidebar-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 16px 14px; border-bottom: 1px solid var(--border); min-height: 56px;
  }
  .sidebar-brand { display: flex; align-items: center; gap: 10px; overflow: hidden; white-space: nowrap; }
  .sidebar-logo { font-size: 18px; flex-shrink: 0; width: 28px; text-align: center; }
  .sidebar-title { font-size: 13px; font-weight: 700; color: var(--text-primary); letter-spacing: -0.01em; transition: opacity 0.2s; white-space: nowrap; }
  .sidebar.collapsed .sidebar-title { opacity: 0; width: 0; }
  .sidebar-toggle {
    background: none; border: none; color: var(--text-muted);
    cursor: pointer; padding: 6px; border-radius: 6px;
    transition: all 0.15s; flex-shrink: 0; font-size: 11px;
  }
  .sidebar-toggle:hover { background: var(--bg-input); color: var(--text-primary); }
  .sidebar.collapsed .sidebar-header { justify-content: center; padding: 16px 0; }
  .sidebar.collapsed .sidebar-brand { display: none; }
  .sidebar-nav { padding: 10px 8px; display: flex; flex-direction: column; gap: 2px; }
  .sidebar-spacer { flex: 1; }
  .sidebar-bottom {
    padding: 8px 8px 16px; display: flex; flex-direction: column; gap: 2px;
    border-top: 1px solid var(--border);
  }
  .nav-item {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 12px; border-radius: 8px; cursor: pointer;
    color: var(--text-secondary); transition: all 0.15s;
    white-space: nowrap; overflow: hidden;
    font-size: 13px; font-weight: 500;
    text-decoration: none; position: relative;
  }
  .nav-item::before {
    content: ''; position: absolute; left: 0; top: 50%;
    transform: translateY(-50%); width: 3px; height: 0;
    border-radius: 0 2px 2px 0; background: var(--accent);
    transition: height 0.2s;
  }
  .nav-item:hover { background: var(--bg-input); color: var(--text-primary); }
  .nav-item:hover::before { height: 14px; }
  .nav-item.active { background: rgba(0,136,255,0.08); color: var(--accent); font-weight: 600; }
  .nav-item.active::before { height: 20px; }
  .nav-item i { width: 16px; text-align: center; flex-shrink: 0; font-size: 13px; }
  .nav-label { transition: opacity 0.2s; }
  .sidebar.collapsed .nav-label { opacity: 0; width: 0; }
  .sidebar.collapsed .nav-item { justify-content: center; padding: 9px; gap: 0; }
  .sidebar.collapsed .sidebar-nav,
  .sidebar.collapsed .sidebar-bottom { padding-left: 0; padding-right: 0; align-items: center; }
  .nav-sub { display: flex; flex-direction: column; gap: 1px; margin-top: 1px; }
  .nav-sub-item { display: flex; align-items: center; gap: 8px; padding: 7px 10px 7px 32px; border-radius: 8px; cursor: pointer; color: var(--text-muted); font-size: 12px; font-weight: 500; text-decoration: none; transition: all 0.15s; white-space: nowrap; overflow: hidden; }
  .nav-sub-item:hover { background: var(--bg-input); color: var(--text-primary); }
  .nav-sub-item.active { color: var(--accent); font-weight: 600; }
  .nav-item.parent-active { color: var(--text-primary); }
  .sidebar.collapsed .nav-sub { display: none; }

  .main-content {
    flex: 1; min-width: 0;
    display: flex; flex-direction: column;
    overflow: hidden;
    background: var(--bg-primary);
  }

  header {
    background: var(--bg-card);
    border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 24px; flex-shrink: 0; height: 52px;
  }
  .header-left { display: flex; align-items: center; gap: 12px; }
  .header-right { display: flex; align-items: center; gap: 10px; }
  .header-title { font-weight: 700; font-size: 15px; }
  .header-count { font-size: 12px; color: var(--text-muted); background: var(--bg-input); padding: 2px 8px; border-radius: 10px; }

  /* H1/H2/All toggle */
  .type-toggle { display: flex; background: var(--bg-input); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
  .type-toggle button { padding: 4px 10px; font-size: 12px; font-weight: 500; color: var(--text-muted); background: transparent; border: none; cursor: pointer; transition: background .15s, color .15s; white-space: nowrap; }
  .type-toggle button:not(:last-child) { border-right: 1px solid var(--border); }
  .type-toggle button:hover { background: var(--border); color: var(--text-primary); }
  .type-toggle button.active { background: var(--accent); color: #fff; }
  [data-theme="dark"] .type-toggle { background: var(--bg-input); border-color: var(--border); }
  [data-theme="dark"] .type-toggle button { color: var(--text-secondary); }
  [data-theme="dark"] .type-toggle button:not(:last-child) { border-color: var(--border); }

  .content-wrap {
    flex: 1; overflow-y: auto; padding: 20px 24px;
    display: flex; flex-direction: column; gap: 16px;
  }

  /* ── Overall Summary ── */
  .overall-summary {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-card);
    padding: 20px 24px;
    display: flex; align-items: center; gap: 24px;
  }
  .overall-stats { display: flex; gap: 20px; align-items: center; flex-shrink: 0; }
  .overall-stat { text-align: center; }
  .overall-stat-num { font-size: 28px; font-weight: 700; line-height: 1.2; }
  .overall-stat-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; }
  .overall-bar-wrap { flex: 1; min-width: 0; }

  /* ── Team Card ── */
  .theme-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: var(--shadow-card);
    transition: box-shadow 0.2s;
  }
  .theme-card:hover { box-shadow: var(--shadow-lg); }

  .theme-card-header {
    display: flex;
    align-items: center;
    padding: 20px 24px;
    cursor: pointer;
    user-select: none;
    gap: 16px;
    position: relative;
  }

  .theme-accent {
    position: absolute;
    left: 0;
    top: 0;
    bottom: 0;
    width: 4px;
  }

  .theme-icon {
    width: 40px; height: 40px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; flex-shrink: 0;
  }

  .theme-info { flex: 1; min-width: 0; }
  .theme-name { font-size: 15px; font-weight: 700; margin-bottom: 4px; }
  .theme-badges { display: flex; gap: 8px; align-items: center; }
  .theme-badge {
    font-size: 11px; color: var(--text-muted);
    background: var(--bg-input); padding: 2px 8px;
    border-radius: 10px; white-space: nowrap;
  }

  .theme-progress { flex-shrink: 0; text-align: center; }
  .progress-ring-wrap { position: relative; width: 56px; height: 56px; }
  .progress-ring-wrap svg { transform: rotate(-90deg); }
  .progress-ring-bg { fill: none; stroke: var(--bg-input); stroke-width: 5; }
  .progress-ring-fg { fill: none; stroke-width: 5; stroke-linecap: round; transition: stroke-dashoffset 0.5s ease; }
  .progress-pct {
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 14px; font-weight: 700;
  }
  .progress-label { font-size: 9px; color: var(--text-muted); margin-top: 4px; white-space: nowrap; }

  .theme-chevron {
    font-size: 12px; color: var(--text-muted);
    transition: transform 0.2s; flex-shrink: 0;
  }
  .theme-card.expanded .theme-chevron { transform: rotate(180deg); }

  /* ── Summary (always visible below header) ── */
  .theme-summary {
    display: block;
    padding: 16px 24px 20px;
    border-top: 1px solid var(--border);
    background: var(--bg-card);
  }

  /* ── Expanded body (projects table) ── */
  .theme-body {
    display: none;
    border-top: 1px solid var(--border);
    padding: 20px 24px;
    max-height: 600px;
    overflow-y: auto;
  }
  .theme-card.expanded .theme-body { display: block; }

  /* Phase counts */
  .phase-counts {
    display: flex; gap: 8px; margin-bottom: 16px; flex-wrap: wrap;
  }
  .phase-count-box {
    flex: 1; min-width: 80px;
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 10px 12px;
    text-align: center;
  }
  .phase-count-num { font-size: 22px; font-weight: 700; line-height: 1.2; }
  .phase-count-label { font-size: 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.04em; }

  /* Phase bar */
  .phase-bar-section { margin-bottom: 20px; }
  .phase-bar-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); margin-bottom: 8px; }
  .phase-bar-track {
    height: 14px; border-radius: 7px; display: flex;
    overflow: hidden; background: var(--bg-input);
  }
  .phase-bar-seg { height: 100%; transition: width 0.4s ease; min-width: 0; }
  .phase-bar-legend {
    display: flex; gap: 14px; margin-top: 8px; flex-wrap: wrap;
  }
  .phase-legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text-muted); }
  .phase-legend-dot { width: 8px; height: 8px; border-radius: 2px; }

  /* Project table */
  .projects-section { margin-top: 4px; }
  .projects-label { font-size: 10px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.06em; color: var(--text-muted); margin-bottom: 10px; }
  .projects-table {
    width: 100%; border-collapse: collapse;
  }
  .projects-table th {
    text-align: left; font-size: 10px; font-weight: 700;
    text-transform: uppercase; letter-spacing: 0.06em;
    color: var(--text-muted); padding: 8px 12px;
    border-bottom: 1px solid var(--border);
  }
  .projects-table td {
    padding: 10px 12px; border-bottom: 1px solid var(--border);
    font-size: 12px; vertical-align: middle;
  }
  .projects-table tr:last-child td { border-bottom: none; }
  .projects-table tr:hover td { background: var(--bg-input); }

  .proj-name-cell { font-weight: 500; }
  .proj-name-cell a {
    color: var(--text-primary); text-decoration: none;
  }
  .proj-name-cell a:hover { color: var(--accent); text-decoration: underline; }
  .off-vault-name { color: var(--text-muted); }

  .phase-pill {
    display: inline-block;
    padding: 2px 10px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 600;
    white-space: nowrap;
    text-transform: capitalize;
  }

  .priority-pill {
    display: inline-block;
    padding: 2px 8px;
    border-radius: 10px;
    font-size: 11px;
    font-weight: 700;
    white-space: nowrap;
    min-width: 28px;
    text-align: center;
  }
  .priority-pill.p0 { background: rgba(239,68,68,0.12); color: #dc2626; }
  .priority-pill.p1 { background: rgba(245,158,11,0.12); color: #d97706; }
  .priority-pill.p2 { background: rgba(59,130,246,0.10); color: #2563eb; }
  .priority-pill.p3 { background: var(--bg-input); color: var(--text-secondary); }
  .priority-pill.p4 { background: var(--bg-input); color: var(--text-muted); }
  .priority-pill.none { background: transparent; color: var(--text-muted); }

  /* Pull project text closer to left edge */
  .projects-table th:first-child,
  .projects-table td:first-child { padding-left: 0; }

  /* Side panel */
  .side-panel {
    position: fixed; top: 0; right: 0; bottom: 0;
    width: 50%; min-width: 480px; max-width: 900px;
    background: var(--bg-card);
    border-left: 1px solid var(--border);
    box-shadow: -8px 0 30px rgba(0,0,0,.1);
    z-index: 200;
    transform: translateX(100%);
    transition: transform .25s cubic-bezier(.4,0,.2,1);
    display: flex; flex-direction: column;
  }
  .side-panel.open { transform: translateX(0); }
  .side-panel-header {
    display: flex; align-items: center; gap: 12px;
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    flex-shrink: 0;
  }
  .side-panel-icon {
    width: 40px; height: 40px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-size: 18px; flex-shrink: 0;
  }
  .side-panel-title { font-size: 15px; font-weight: 700; flex: 1; }
  .side-panel-close {
    background: none; border: none; color: var(--text-muted);
    cursor: pointer; font-size: 16px; padding: 6px; border-radius: 6px;
  }
  .side-panel-close:hover { background: var(--bg-input); color: var(--text-primary); }
  .side-panel-body { flex: 1; overflow-y: auto; padding: 20px; }
  .side-panel-overlay {
    position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,.2); z-index: 199; display: none;
  }
  .side-panel-overlay.open { display: block; }
  [data-theme="dark"] .side-panel { box-shadow: -8px 0 30px rgba(0,0,0,.4); }
  [data-theme="dark"] .side-panel-overlay.open { background: rgba(0,0,0,.5); }

  .theme-card-header .theme-expand-hint {
    font-size: 11px; color: var(--text-muted);
    display: flex; align-items: center; gap: 4px;
  }
  .theme-card-header:hover .theme-expand-hint { color: var(--accent); }

  /* ── Team Update Section ── */
  .team-update {
    padding: 0 0 20px;
    background: var(--bg-card);
  }

  .update-header {
    display: flex; align-items: center; justify-content: space-between;
    margin-bottom: 16px;
  }
  .update-title {
    font-size: 13px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.04em; color: var(--text-muted);
  }
  .update-date { font-size: 11px; color: var(--text-muted); }

  .update-metrics {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
    gap: 10px; margin-bottom: 20px;
  }
  .update-metric {
    border: 1px solid var(--border); border-radius: 8px;
    padding: 12px 14px; background: var(--bg-primary);
  }
  .update-metric-value {
    font-size: 20px; font-weight: 700; line-height: 1.2;
    letter-spacing: -0.02em;
  }
  .update-metric-label { font-size: 10px; color: var(--text-muted); margin-top: 2px; }
  .update-metric-trend { font-size: 10px; margin-top: 4px; font-weight: 500; }
  .trend-up { color: #10b981; }
  .trend-down { color: #ef4444; }
  .trend-neutral { color: var(--text-muted); }

  .update-columns {
    display: grid; grid-template-columns: 1fr; gap: 20px;
  }
  @media (min-width: 1400px) { .side-panel .update-columns { grid-template-columns: 1fr 1fr; } }

  .update-section-label {
    font-size: 11px; font-weight: 700; text-transform: uppercase;
    letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 10px;
    display: flex; align-items: center; gap: 6px;
  }
  .update-section-label i { font-size: 10px; }

  .highlight-item {
    padding: 10px 14px; border-radius: 8px;
    border: 1px solid var(--border); margin-bottom: 8px;
    font-size: 12px; line-height: 1.5;
  }
  .highlight-title {
    font-weight: 600; color: var(--text-primary); margin-bottom: 2px;
  }
  .highlight-detail { color: var(--text-secondary); }
  .highlight-link {
    color: var(--accent); text-decoration: none; font-weight: 500;
  }
  .highlight-link:hover { text-decoration: underline; }

  .shift-item {
    padding: 8px 12px; border-radius: 8px;
    border-left: 3px solid #f59e0b;
    background: var(--bg-primary); margin-bottom: 8px;
    font-size: 12px; line-height: 1.5;
  }
  .shift-item.risk { border-left-color: #ef4444; }
  .shift-item.positive { border-left-color: #10b981; }
  .shift-title { font-weight: 600; color: var(--text-primary); }
  .shift-detail { color: var(--text-secondary); margin-top: 2px; }

  .update-source {
    margin-top: 16px; padding-top: 12px;
    border-top: 1px solid var(--border);
    font-size: 11px; color: var(--text-muted);
  }
  .update-source a { color: var(--accent); text-decoration: none; }
  .update-source a:hover { text-decoration: underline; }

  .empty-state { padding: 60px; text-align: center; color: var(--text-muted); }
  .loading-spinner {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
</style>
</head>
<body>

<div class="app-layout">

<nav class="sidebar" id="sidebar">
  <div class="sidebar-header">
    <div class="sidebar-brand">
      <span class="sidebar-logo">💳</span>
      <span class="sidebar-title">PCB Roadmap</span>
    </div>
    <button class="sidebar-toggle" id="sidebarToggle" title="Collapse"><i class="fas fa-chevron-left"></i></button>
  </div>
  <div class="sidebar-nav">
    <a href="https://pcb-hub.quick.shopify.io/" class="nav-item">
      <i class="fas fa-house"></i>
      <span class="nav-label">PCB Hub</span>
    </a>
    <a href="timeline.html" class="nav-item parent-active">
      <i class="fas fa-chart-gantt"></i>
      <span class="nav-label">Roadmap Calendar</span>
    </a>
    <div class="nav-sub">
      <a href="index.html" class="nav-sub-item">
        <i class="fas fa-table-cells"></i>
        <span class="nav-label">Roadmap</span>
      </a>
      <a href="themes.html" class="nav-sub-item">
        <i class="fas fa-layer-group"></i>
        <span class="nav-label">By Theme</span>
      </a>
      <a href="performance.html" class="nav-sub-item active">
        <i class="fas fa-chart-line"></i>
        <span class="nav-label">Performance to Plan</span>
      </a>
      <a href="calendar.html" class="nav-sub-item">
        <i class="fas fa-calendar-days"></i>
        <span class="nav-label">Release Calendar</span>
      </a>
    </div>
    <a href="weekly.html" class="nav-item" style="margin-top:8px">
      <i class="fas fa-bolt"></i>
      <span class="nav-label">Weekly Snapshot</span>
    </a>
  </div>
  <div class="sidebar-spacer"></div>
  <div class="sidebar-bottom">
    <a href="https://docs.google.com/spreadsheets/d/17xd1aWdtf33kUk3giF5WyC4dJpbClOjPGh2cVMYiuvI" target="_blank" class="nav-item">
      <i class="fas fa-external-link-alt"></i>
      <span class="nav-label">Source Sheet</span>
    </a>
    <div class="nav-item" id="darkModeToggle">
      <i class="fas fa-moon"></i>
      <span class="nav-label">Dark Mode</span>
    </div>
  </div>
</nav>

<div class="main-content">
<header>
  <div class="header-left">
    <span class="header-title" id="header-title">Performance to Plan</span>
    <span class="header-count" id="header-count"></span>
  </div>
  <div class="header-right"></div>

function getVaultUrl(projectName) {
  if (!projectName || !vaultUrls) return null;
  if (vaultUrls[projectName]) return vaultUrls[projectName];
  const lower = projectName.toLowerCase();
  for (const [key, url] of Object.entries(vaultUrls)) {
    if (key.toLowerCase() === lower) return url;
  }
  for (const [key, url] of Object.entries(vaultUrls)) {
    if (lower.includes(key.toLowerCase()) || key.toLowerCase().includes(lower)) return url;
  }
  return null;
}

function getPhase(p) {
  const phase = (p.phase || '').toLowerCase().replace(/_/g, '-');
  if (phase === 'done') return 'done';
  if (phase === 'release') return 'release';
  if (phase === 'observe') return 'observe';
  if (phase === 'build' || phase === 'in-progress') return 'build';
  if (phase === 'prototype') return 'prototype';
  if (phase === 'stopped' || phase === 'paused') return 'stopped';
  if (phase === 'proposal') return 'prototype';
  if (phase === 'planned') return 'planned';
  const hasVault = !!getVaultUrl(p.name);
  if (!hasVault) {
    const vs = (p.vaultStatus || '').toLowerCase();
    if (vs === 'backlog') return 'planned';
    return 'off-vault';
  }
  return 'build';
}

function parseProjects(rows) {
  if (!rows || rows.length < 2) return [];
  const headers = rows[0];
  const colIndex = {};
  headers.forEach((h, i) => { colIndex[h.toLowerCase().trim()] = i; });

  return rows.slice(1).map((row, idx) => {
    const get = (key) => {
      const i = colIndex[key.toLowerCase()];
      return i !== undefined ? (row[i] || '').trim() : '';
    };
    const project = get('project (ensure vault project is linked)') || get('project');
    if (!project) return null;
    return {
      id: idx + 1,
      theme: get('pcb theme'),
      name: project,
      description: get('description'),
      team: get('team'),
      subTeam: get('sub team') || get('subteam'),
      half: get('h'),
      rank: get('rank'),
      priority: get('priority') || get('p') || '',
      shipping: get('shipping'),
      status: get('status') || '',
      phase: get('phase'),
      vaultStatus: get('vault status'),
    };
  }).filter(p => p !== null && p.theme);
}

function renderProgressRing(pct, color) {
  const r = 23, c = 2 * Math.PI * r;
  const offset = c - (pct / 100) * c;
  return `<div class="progress-ring-wrap">
    <svg width="56" height="56" viewBox="0 0 56 56">
      <circle class="progress-ring-bg" cx="28" cy="28" r="${r}"/>
      <circle class="progress-ring-fg" cx="28" cy="28" r="${r}"
        stroke="${color}" stroke-dasharray="${c}" stroke-dashoffset="${offset}"/>
    </svg>
    <span class="progress-pct">${Math.round(pct)}%</span>
  </div>
  <div class="progress-label">In Progress or Done</div>`;
}

function buildPhaseBar(phaseCounts, total) {
  const planned = (phaseCounts['planned']||0) + (phaseCounts['off-vault']||0);
  const displayPhases = [
    {key:'planned',label:'Planned',count:planned,color:'#94a3b8'},
    {key:'prototype',label:'Prototype',count:phaseCounts['prototype']||0,color:'#a855f7'},
    {key:'build',label:'Build',count:phaseCounts['build']||0,color:'#f59e0b'},
    {key:'observe',label:'Observe',count:phaseCounts['observe']||0,color:'#06b6d4'},
    {key:'release',label:'Release',count:phaseCounts['release']||0,color:'#3b82f6'},
    {key:'done',label:'Done',count:phaseCounts['done']||0,color:'#6b7280'},
  ].filter(p=>p.count>0);
  const barSegsHtml = displayPhases.map(p => {
    const w = (p.count / total) * 100;
    return `<div class="phase-bar-seg" style="width:${w}%;background:${p.color}" title="${p.label}: ${p.count}"></div>`;
  }).join('');
  const legendHtml = displayPhases.map(p =>
    `<div class="phase-legend-item"><div class="phase-legend-dot" style="background:${p.color}"></div>${p.label} (${p.count})</div>`
  ).join('');
  return { barSegsHtml, legendHtml };
}

function dedupeProjects(projects) {
  const seenUrls = {};
  const seenNames = {};
  const result = [];
  for (const p of projects) {
    const vu = getVaultUrl(p.name);
    if (vu) {
      if (seenUrls[vu]) {
        if (!seenUrls[vu].phase && p.phase) seenUrls[vu] = p;
        continue;
      }
      seenUrls[vu] = p;
    } else {
      const key = p.name.toLowerCase().trim();
      if (seenNames[key]) {
        if (!seenNames[key].phase && p.phase) seenNames[key] = p;
        continue;
      }
      seenNames[key] = p;
    }
    result.push(p);
  }
  return result.map(p => {
    const vu = getVaultUrl(p.name);
    if (vu && seenUrls[vu]) return seenUrls[vu];
    const key = p.name.toLowerCase().trim();
    if (seenNames[key]) return seenNames[key];
    return p;
  });
}

function buildTeamUpdate(team) {
  const update = TEAM_UPDATES[team];
  if (!update) return '';

  const metricsHtml = update.metrics.map(m => {
    const trendClass = m.trendDir === 'up' ? 'trend-up' : m.trendDir === 'down' ? 'trend-down' : 'trend-neutral';
    const trendIcon = m.trendDir === 'up' ? '&#9650;' : m.trendDir === 'down' ? '&#9660;' : '';
    return `<div class="update-metric">
      <div class="update-metric-value">${m.value}</div>
      <div class="update-metric-label">${m.label}</div>
      ${m.trend ? `<div class="update-metric-trend ${trendClass}">${trendIcon} ${m.trend}</div>` : ''}
    </div>`;
  }).join('');

  const highlightsHtml = update.highlights.map(h => {
    const linkHtml = h.link ? ` <a href="${h.link}" target="_blank" class="highlight-link">View project &rarr;</a>` : '';
    return `<div class="highlight-item">
      <div class="highlight-title">${h.title}</div>
      <div class="highlight-detail">${h.detail}${linkHtml}</div>
    </div>`;
  }).join('');

  const shiftsHtml = update.shifts.map(s => {
    const typeClass = s.type === 'risk' ? ' risk' : s.type === 'positive' ? ' positive' : '';
    return `<div class="shift-item${typeClass}">
      <div class="shift-title">${s.title}</div>
      <div class="shift-detail">${s.detail}</div>
    </div>`;
  }).join('');

  return `<div class="team-update">
    <div class="update-columns">
      <div>
        <div class="update-section-label"><i class="fas fa-trophy"></i> Top Highlights</div>
        ${highlightsHtml}
      </div>
      <div>
        <div class="update-section-label"><i class="fas fa-arrows-rotate"></i> Prioritization Shifts</div>
        ${shiftsHtml}
      </div>
    </div>
    <div class="update-source">Source: <a href="${update.source}" target="_blank">${update.sourceLabel}</a> &middot; As of ${update.date}</div>
  </div>`;
}

  const content = document.getElementById('content');
  const selectedProjects = dedupeProjects(allProjects.filter(p => (selectedHalf === 'all' || p.half === selectedHalf) && (p.rank || '').toUpperCase() !== 'N/A'));
  const halfLabel = selectedHalf === 'all' ? '' : selectedHalf + ' ';

  const titleEl = document.getElementById('header-title');
  if (titleEl) titleEl.textContent = `${halfLabel}Performance to Plan`;
  document.getElementById('header-count').textContent = `${selectedProjects.length} projects`;

  if (!selectedProjects.length) {
    content.innerHTML = `<div class="empty-state">No projects found.</div>`;
    return;
  }

  const grouped = {};
  selectedProjects.forEach(p => {
    const team = p.team || 'Other';
    if (!grouped[team]) grouped[team] = [];
    grouped[team].push(p);
  });

  const overallPhaseCounts = {};
  PHASES.forEach(ph => overallPhaseCounts[ph] = 0);
  selectedProjects.forEach(p => {
    const ph = getPhase(p);
    if (overallPhaseCounts[ph] !== undefined) overallPhaseCounts[ph]++;
    else overallPhaseCounts['build']++;
  });
  const overallAdvanced = (overallPhaseCounts['prototype']||0) + (overallPhaseCounts['build']||0) + (overallPhaseCounts['observe']||0) + (overallPhaseCounts['release']||0) + (overallPhaseCounts['done']||0);
  const overallPct = selectedProjects.length > 0 ? (overallAdvanced / selectedProjects.length) * 100 : 0;
  const overallBar = buildPhaseBar(overallPhaseCounts, selectedProjects.length);

  let html = `<div class="overall-summary" style="flex-direction:column;gap:16px;">
    <div style="display:flex;align-items:center;gap:20px;">
      <div style="flex-shrink:0;">
        ${renderProgressRing(overallPct, '#0088FF')}
      </div>
      <div style="flex:1;min-width:0;">
        <div style="font-size:18px;font-weight:700;margin-bottom:4px;">Payments & Cross Border</div>
        <div style="font-size:12px;color:var(--text-muted);">${halfLabel}Performance to Plan · ${selectedProjects.length} projects</div>
      </div>
    </div>
    <div class="overall-bar-wrap">
      <div class="phase-bar-section" style="margin-bottom:0">
        <div class="phase-bar-label">Aggregate Phase Breakdown</div>
        <div class="phase-bar-track">${overallBar.barSegsHtml}</div>
        <div class="phase-bar-legend">${overallBar.legendHtml}</div>
      </div>
    </div>
  </div>`;

  const teamOrder = [
    'Money Movement',
    'Payments Platform & Risk',
    'Cross Border',
    'Payments Experience',
    'Shop Wallet',
    'Billing',
    'Taxes',
  ];

  const teams = teamOrder.filter(t => grouped[t]);
  Object.keys(grouped).forEach(t => {
    if (!teams.includes(t)) teams.push(t);
  });

  teams.forEach((team, tIdx) => {
    const projects = grouped[team];
    const config = TEAM_CONFIG[team] || { color: '#6b7280', icon: '📦' };

    const phaseCounts = {};
    PHASES.forEach(ph => phaseCounts[ph] = 0);
    projects.forEach(p => {
      const ph = getPhase(p);
      if (phaseCounts[ph] !== undefined) phaseCounts[ph]++;
      else phaseCounts['build']++;
    });

    const advancedCount = (phaseCounts['prototype']||0) + (phaseCounts['build']||0) + (phaseCounts['observe']||0) + (phaseCounts['release']||0) + (phaseCounts['done']||0);
    const progressPct = projects.length > 0 ? (advancedCount / projects.length) * 100 : 0;

    const phaseCountsHtml = PHASES.map(ph => `
      <div class="phase-count-box">
        <div class="phase-count-num" style="color:${PHASE_COLORS[ph]}">${phaseCounts[ph]}</div>
        <div class="phase-count-label">${PHASE_LABELS[ph]}</div>
      </div>
    `).join('');

    const { barSegsHtml, legendHtml } = buildPhaseBar(phaseCounts, projects.length);

    const prioRank = { 'P0': 0, 'P1': 1, 'P2': 2, 'P3': 3, 'P4': 4 };
    const sortedProjects = [...projects].sort((a, b) => {
      const pA = prioRank[(a.priority || '').toUpperCase()] ?? 9;
      const pB = prioRank[(b.priority || '').toUpperCase()] ?? 9;
      if (pA !== pB) return pA - pB;
      return (parseInt(a.rank) || 999) - (parseInt(b.rank) || 999);
    });

    const rowsHtml = sortedProjects.map(p => {
      const phase = getPhase(p);
      const phColor = PHASE_COLORS[phase];
      const phBg = PHASE_BG[phase];
      const vaultUrl = getVaultUrl(p.name);
      const nameCell = vaultUrl
        ? `<a href="${vaultUrl}" target="_blank">${p.name}</a>`
        : `<span class="off-vault-name">${p.name}</span>`;
      const prio = (p.priority || '').toUpperCase();
      const prioClass = ['P0','P1','P2','P3','P4'].includes(prio) ? prio.toLowerCase() : 'none';
      const prioCell = prio ? `<span class="priority-pill ${prioClass}">${prio}</span>` : '<span class="priority-pill none">—</span>';
      return `<tr>
        <td class="proj-name-cell">${nameCell}</td>
        <td style="text-align:center">${prioCell}</td>
        <td>${p.subTeam || '—'}</td>
        <td><span class="phase-pill" style="background:${phBg};color:${phColor}">${PHASE_LABELS[phase]}</span></td>
        <td>${p.shipping || '—'}</td>
      </tr>`;
    }).join('');

    teamPanelData[team] = {
      icon: config.icon,
      color: config.color,
      projects: projects.length,
      updateHtml: buildTeamUpdate(team),
      tableHtml: `<div class="projects-section" style="margin-top:0">
        <div class="projects-label">Team Projects (${projects.length})</div>
        <table class="projects-table">
          <thead><tr><th>Project</th><th style="text-align:center">Priority</th><th>Sub Team</th><th>Phase</th><th>Est. End</th></tr></thead>
          <tbody>${rowsHtml}</tbody>
        </table>
      </div>`,
    };

    html += `<div class="theme-card" data-team-idx="${tIdx}" onclick="openTeamPanel('${team.replace(/'/g, "\\'")}')" style="cursor:pointer">
      <div class="theme-card-header">
        <div class="theme-accent" style="background:${config.color}"></div>
        <div class="theme-icon" style="background:${config.color}18;color:${config.color}">${config.icon}</div>
        <div class="theme-info">
          <div class="theme-name">${team}</div>
          <div class="theme-badges">
            <span class="theme-badge">${projects.length} projects</span>
          </div>
        </div>
        <div class="theme-progress">
          ${renderProgressRing(progressPct, config.color)}
        </div>
        <div class="theme-expand-hint"><i class="fas fa-chevron-right"></i> View details</div>
      </div>
      <div class="theme-summary">
        <div class="phase-counts">${phaseCountsHtml}</div>
        <div class="phase-bar-section" style="margin-bottom:0">
          <div class="phase-bar-label">Phase Breakdown</div>
          <div class="phase-bar-track">${barSegsHtml}</div>
          <div class="phase-bar-legend">${legendHtml}</div>
        </div>
      </div>
    </div>`;
  });

  content.innerHTML = html;
}

function openTeamPanel(team) {
  const data = teamPanelData[team];
  if (!data) return;
  document.getElementById('sidePanelTitle').textContent = team;
  const iconEl = document.getElementById('sidePanelIcon');
  iconEl.textContent = data.icon;
  iconEl.style.background = data.color + '18';
  iconEl.style.color = data.color;
  document.getElementById('sidePanelBody').innerHTML = `${data.updateHtml}${data.tableHtml}`;
  document.getElementById('sidePanel').classList.add('open');
  document.getElementById('sidePanelOverlay').classList.add('open');
}

function closeSidePanel() {
  document.getElementById('sidePanel').classList.remove('open');
  document.getElementById('sidePanelOverlay').classList.remove('open');
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeSidePanel();
});

async function loadData() {
  const content = document.getElementById('content');
  content.innerHTML = '<div class="empty-state"><span class="loading-spinner"></span> Loading data…</div>';
  try {
    const response = await fetch('data/projects.json');
    if (!response.ok) throw new Error('Failed to load data');
    const data = await response.json();
    vaultUrls = data.vaultUrls || {};
    allProjects = parseProjects(data.rows);
    render();
  } catch (e) {
    content.innerHTML = `<div class="empty-state">Failed to load data: ${e.message}</div>`;
  }
}

(function() {
  const toggle = document.getElementById('darkModeToggle');
  const sidebarToggle = document.getElementById('sidebarToggle');
  const sidebar = document.getElementById('sidebar');

  function updateDarkIcon() {
    const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
    const icon = toggle ? toggle.querySelector('i') : null;
    if (icon) icon.className = isDark ? 'fas fa-sun' : 'fas fa-moon';
  }

  if (toggle) {
    toggle.addEventListener('click', () => {
      const current = document.documentElement.getAttribute('data-theme');
      const next = current === 'dark' ? 'light' : 'dark';
      document.documentElement.setAttribute('data-theme', next);
      localStorage.setItem('pcb-theme', next);
      updateDarkIcon();
    });
    updateDarkIcon();
  }

  if (sidebarToggle && sidebar) {
    const saved = localStorage.getItem('pcb-sidebar-collapsed');
    if (saved === '1') sidebar.classList.add('collapsed');
    sidebarToggle.addEventListener('click', () => {
      sidebar.classList.toggle('collapsed');
      localStorage.setItem('pcb-sidebar-collapsed', sidebar.classList.contains('collapsed') ? '1' : '0');
    });
  }
})();

// Hide sidebar when embedded (e.g. PCB Hub loads with ?embed=1)
if (new URLSearchParams(window.location.search).has('embed')) {
  document.addEventListener('DOMContentLoaded', () => {
    const sidebar = document.getElementById('sidebar');
    if (sidebar) sidebar.style.display = 'none';
  });
}

document.addEventListener('DOMContentLoaded', loadData);
</script>
</body>
</html>
